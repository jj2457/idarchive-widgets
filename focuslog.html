<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Focus Log</title>
<link rel="stylesheet" href="assets/core.css">
<style>
  .wrap { max-width: 560px; }
  .chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 5px; }
  .chips button { font-size: 10.5px; letter-spacing: .04em; padding: 5px 11px; border-radius: 999px;
                  background: none; text-transform: none; }
  .chips button.on { background: var(--soft); border-color: var(--soft);
                     color: color-mix(in srgb, var(--deep) 60%, #2a2a2a); font-weight: 500; }
  .clock { margin-top: 14px; text-align: center; }
  .clock .t { font-family: var(--serif); font-size: 34px; letter-spacing: .04em; color: var(--ink); line-height: 1.1; }
  .clock .t.run { color: color-mix(in srgb, var(--deep) 60%, #2a2a2a); }
  .clock .n { margin-top: 3px; font-size: 10px; letter-spacing: .16em; color: var(--sub); text-transform: uppercase; }
  .act { margin-top: 12px; display: flex; gap: 8px; justify-content: center; }
  .act button { min-width: 92px; padding: 7px 0; font-size: 10px; letter-spacing: .18em; }
  /* the pale tile needs dark text in both modes — plain var(--ink) turns near-white in dark */
  .act button.go { background: var(--soft); border-color: var(--soft);
                   color: color-mix(in srgb, var(--deep) 60%, #2a2a2a); }
  .act button.go:disabled { opacity: .55; }
  .range { margin-top: 16px; display: flex; gap: 4px; justify-content: center; }
  .range button { font-size: 9.5px; letter-spacing: .1em; padding: 4px 10px; border-radius: 999px;
                  background: none; text-transform: none; }
  .range button.on { background: var(--tint); border-color: var(--soft); color: var(--ink); }
  .rows { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .r { display: grid; grid-template-columns: 74px 1fr 62px; gap: 8px; align-items: center; }
  .r .k { font-size: 11px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r .bar { height: 7px; border-radius: 999px; background: var(--tint); overflow: hidden; }
  .r .bar i { display: block; height: 100%; background: var(--soft); border-radius: 999px; }
  .r .v { font-size: 11.5px; color: var(--ink); text-align: right; letter-spacing: .02em; }
  .r.zero .v { color: var(--sub); }
  .foot { margin-top: 12px; display: flex; justify-content: space-between; gap: 10px;
          font-size: 11px; color: var(--sub); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="badge" id="badge">FOCUS LOG</div><span class="caps" id="total"></span></div>
  <div class="grow"><div class="wrap">
    <div class="chips" id="chips"></div>
    <div class="clock"><div class="t" id="t">0:00</div><div class="n" id="now"></div></div>
    <div class="act">
      <button type="button" class="go" id="go">시작</button>
      <button type="button" id="stop">정지</button>
    </div>
    <div class="range" id="range"></div>
    <div class="rows" id="rows"></div>
  </div></div>
  <div class="foot"><span id="hint">멈추면 그 시간이 그 습관에 쌓입니다</span><span>이 기기에 저장돼요</span></div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js"></script>
<script>
  // The planner's FOCUS widget is a pomodoro — it counts down and forgets. This one counts up and
  // remembers: pick the habit, start, stop, and the minutes land against that habit for today.
  // The record is this device's (docs/WIDGET_STORAGE.md); the planner's HABITS table stays the
  // long-term book, and docs/WIDGET_DATA_MODES.md holds the design for reading it one day.
  var RANGES = [['day', '오늘'], ['week', '이번 주'], ['month', '이번 달']];
  var KEY = '', ITEMS = [], FROM = 5, RANGE = 'day';

  function readOpts() {
    var raw = IDP.opt('focuslog', 'items', '공부,독서,운동,업무,콘텐츠');
    ITEMS = String(raw).split(',').map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 8);
    FROM = Math.min(23, Math.max(0, +IDP.opt('focuslog', 'from', 5) || 5));
    KEY = 'idarchive.focuslog.' + (IDP.q.get('id') || IDP.opt('focuslog', 'title', 'main'));
  }
  readOpts();

  // the planner's day turns over at 5 AM, the same as TOP 3 · WATER · ROUTINE
  function dayKey(d) {
    var x = new Date((d || IDP.now()).getTime());
    if (x.getHours() < FROM) x.setDate(x.getDate() - 1);
    return IDP.iso(x);
  }
  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (v) return v;
    } catch (e) { /* storage blocked */ }
    // seed for a catalogue or a shared link: d=공부:80,독서:40 — minutes against today
    var t = { s: [], run: null }, today = dayKey();
    (IDP.q.get('d') || '').split(',').forEach(function (part) {
      var at = part.lastIndexOf(':');
      if (at < 0) return;
      var name = part.slice(0, at).trim(), m = parseInt(part.slice(at + 1), 10);
      if (name && m > 0) t.s.push({ d: today, h: name, m: m });
    });
    return t;
  }
  var st = load();
  if (!st.s) st.s = [];
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  var pick = st.s.length ? st.s[st.s.length - 1].h : ITEMS[0];
  if (st.run) pick = st.run.h;

  function fmt(m) {
    m = Math.round(m);
    if (m < 60) return m + 'm';
    return Math.floor(m / 60) + 'h ' + (m % 60 ? (m % 60) + 'm' : '');
  }
  function clock(sec) {
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60);
    return h ? (h + ':' + IDP.pad(m) + ':' + IDP.pad(s)) : (m + ':' + IDP.pad(s));
  }
  function running() {
    if (!st.run) return 0;
    // a tab left open overnight must not book eight hours of "focus" — one session is capped
    return Math.max(0, Math.min(8 * 3600, (IDP.now().getTime() - st.run.at) / 1000));
  }

  function inRange(key) {
    var d = IDP.parseDate(key), today = IDP.parseDate(dayKey());
    if (!d || !today) return false;
    if (RANGE === 'day') return key === dayKey();
    if (RANGE === 'month') return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth();
    var day = today.getDay(), shift = IDP.weekStart === 'sun' ? day : (day + 6) % 7;
    var start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - shift);
    return d >= start && d < new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7);
  }
  function totals() {
    var out = {}, all = ITEMS.slice();
    st.s.forEach(function (x) { if (all.indexOf(x.h) < 0) all.push(x.h); });
    all.forEach(function (n) { out[n] = 0; });
    st.s.forEach(function (x) { if (inRange(x.d)) out[x.h] = (out[x.h] || 0) + x.m; });
    if (st.run && RANGE) out[st.run.h] = (out[st.run.h] || 0) + running() / 60;
    return { map: out, order: all };
  }

  function paintClock() {
    var el = document.getElementById('t');
    el.textContent = clock(running());
    el.className = 't' + (st.run ? ' run' : '');
    document.getElementById('now').textContent = pick || '';
    document.getElementById('go').textContent = st.run ? '진행 중' : '시작';
    document.getElementById('go').disabled = !!st.run;
    document.getElementById('stop').disabled = !st.run;
  }
  function paintRows() {
    var t = totals(), max = 1;
    t.order.forEach(function (n) { if (t.map[n] > max) max = t.map[n]; });
    var sum = 0;
    t.order.forEach(function (n) { sum += t.map[n]; });
    document.getElementById('total').textContent = sum ? fmt(sum) : '';
    var box = document.getElementById('rows');
    box.innerHTML = '';
    t.order.forEach(function (n) {
      var v = t.map[n] || 0;
      var row = document.createElement('div');
      row.className = 'r' + (v ? '' : ' zero');
      var k = document.createElement('div'); k.className = 'k'; k.textContent = n;
      var bar = document.createElement('div'); bar.className = 'bar';
      var i = document.createElement('i'); i.style.width = Math.round(v / max * 100) + '%';
      bar.appendChild(i);
      var val = document.createElement('div'); val.className = 'v'; val.textContent = v ? fmt(v) : '—';
      row.appendChild(k); row.appendChild(bar); row.appendChild(val);
      box.appendChild(row);
    });
  }
  function render() {
    document.getElementById('badge').textContent = IDP.opt('focuslog', 'label', 'FOCUS LOG');
    var chips = document.getElementById('chips');
    chips.innerHTML = '';
    ITEMS.forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = n;
      if (n === pick) b.className = 'on';
      b.onclick = function () {
        if (st.run && st.run.h !== n) stop();   // switching while running closes the open session
        pick = n; render();
      };
      chips.appendChild(b);
    });
    var r = document.getElementById('range');
    r.innerHTML = '';
    RANGES.forEach(function (x) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = x[1];
      if (x[0] === RANGE) b.className = 'on';
      b.onclick = function () { RANGE = x[0]; render(); };
      r.appendChild(b);
    });
    paintClock(); paintRows();
  }

  function start() {
    if (st.run || !pick) return;
    st.run = { h: pick, at: IDP.now().getTime() };
    save(); render();
  }
  function stop() {
    if (!st.run) return;
    var m = running() / 60, name = st.run.h;
    if (m >= 1) st.s.push({ d: dayKey(), h: name, m: Math.round(m) });
    st.run = null;
    st.s = st.s.slice(-600);
    save(); render();
    // the session is already written down; this only says so out loud
    if (m >= 1) IDP.alert(name + ' ' + Math.round(m) + '분', '오늘 기록에 더했어요', { times: 1 });
  }
  document.getElementById('go').onclick = start;
  document.getElementById('stop').onclick = stop;

  IDP.options('focuslog', [
    { k: 'label', label: '제목', ph: 'FOCUS LOG' },
    { k: 'items', label: '습관 · 분야 (쉼표로 구분, 최대 8개)', ph: '공부,독서,운동,업무,콘텐츠' },
    { k: 'from', label: '하루 시작 시각 (0–23)', ph: '5' },
    { k: 'title', label: '이 위젯의 이름 (여러 개 쓸 때)', ph: 'main' }
  ], function () { readOpts(); st = load(); if (!st.s) st.s = []; pick = ITEMS[0]; render(); });
  render();
  setInterval(function () { if (st.run) { paintClock(); paintRows(); } }, 1000);
</script>
</body>
</html>
