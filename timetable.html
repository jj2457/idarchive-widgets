<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Timetable (Notion)</title>
<link rel="stylesheet" href="assets/core.css?v=r6c">
<style>
  .wrap { max-width: 560px; margin: 0 auto; }
  [hidden] { display: none !important; }
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav button { background: none; border: 0; padding: 4px 8px; font-size: 14px; color: var(--sub); letter-spacing: 0; }
  .nav span { font-size: 11.5px; color: var(--ink); letter-spacing: .02em; min-width: 92px; text-align: center; cursor: pointer; }
  .grid { position: relative; margin-top: 10px; border-top: 1px solid var(--line); }
  .hr { position: relative; height: 34px; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
  .hr b { position: absolute; left: 0; top: 3px; font-size: 9.5px; font-weight: 400; color: var(--sub); font-variant-numeric: tabular-nums; }
  .blk { position: absolute; left: 34px; right: 4px; border-radius: 8px; padding: 3px 8px; overflow: hidden; cursor: pointer; box-sizing: border-box; min-height: 18px; }
  .blk .t { font-size: 11.5px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk .m { font-size: 9.5px; color: #666; font-variant-numeric: tabular-nums; }
  .blk.done .t { text-decoration: line-through; color: #888; }
  .blk.sel { outline: 2px solid color-mix(in srgb, var(--deep) 70%, transparent); }
  .act { position: absolute; right: 6px; width: 4px; border-radius: 3px; background: var(--deep); }
  .now { position: absolute; left: 30px; right: 0; height: 0; border-top: 1.5px solid var(--red); }
  .now::before { content: ''; position: absolute; left: -4px; top: -4.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
  .bar { margin-top: 10px; display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .bar .who { width: 100%; text-align: center; font-size: 11.5px; color: var(--ink); }
  .bar .who small { color: var(--sub); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .bar button { padding: 7px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 11px; letter-spacing: .04em; color: var(--ink); text-transform: none; }
  .bar button.go { background: var(--deep); border-color: var(--deep); color: #fff; }
  .loose { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
  .loose span { font-size: 10.5px; padding: 3px 9px; border-radius: 999px; background: var(--tint); color: var(--sub); }
  .rep { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .rep h4 { margin: 0 0 6px; font-size: 10px; letter-spacing: .2em; color: var(--sub); font-weight: 500; }
  .rep .sum { font-size: 12px; color: var(--ink); margin-bottom: 8px; }
  .rep .sum b { color: color-mix(in srgb, var(--deep) 80%, #2a2a2a); }
  .rep .row { display: grid; grid-template-columns: 48px 1fr 70px; gap: 8px; align-items: center; font-size: 10.5px; color: var(--sub); margin: 4px 0; }
  .rep .row .tr { height: 7px; border-radius: 4px; background: var(--tint); position: relative; overflow: hidden; }
  .rep .row .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
  .rep .row .tr u { position: absolute; left: 0; top: 2px; height: 3px; border-radius: 2px; background: color-mix(in srgb, #222 55%, transparent); text-decoration: none; }
  .rep .row span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .gate { margin-top: 12px; text-align: center; font-size: 11.5px; color: var(--sub); line-height: 1.8; }
  .gate button { margin-top: 10px; padding: 9px 18px; border-radius: 999px; background: var(--deep); color: #fff; border: 0; font-size: 12px; letter-spacing: .04em; text-transform: none; }
  .state { font-size: 9.5px; color: var(--sub); text-align: center; margin-top: 8px; letter-spacing: .04em; min-height: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="grow"><div class="wrap">
    <div class="row">
      <div class="badge" id="badge">Timetable</div>
      <div class="nav"><button id="prev" aria-label="전날">‹</button><span id="day" title="오늘로"></span><button id="next" aria-label="다음 날">›</button></div>
    </div>
    <div id="body">
      <div class="grid" id="grid"></div>
      <div class="bar" id="bar" hidden></div>
      <div class="loose" id="loose"></div>
      <div class="rep" id="rep" hidden><h4>DAILY REPORT · 계획 / 실제</h4><div class="sum" id="sum"></div><div id="rows"></div></div>
    </div>
    <div class="gate" id="gate" hidden></div>
    <div class="state" id="state"></div>
  </div></div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js?v=r6c"></script>
<script src="assets/sync.js"></script>
<script>
  // 타임테이블(REQ-136 · 137 · 139) — 노션 할 일 표(TASKS)의 그날 시간 있는 일을 시간 칸에 그대로. 원본은 노션, 위젯은 저장하지 않는다.
  // 칸을 누르고 ▶ 시작 · ■ 끝 → 지금 시각이 그 일의 「실제 시간」에 들어간다(직접 시간을 적지 않아도). 아래 DAILY REPORT = 영역별 계획 · 실제 시간(자동 계산).
  // 색 = 미니 달력과 같은 영역 결(테마 진한 색에 섞음). from · to = 보이는 시간(기본 6 ~ 24). ?demo=1 은 견본(저장 없음).
  var S = IDP.sync, DEMO = IDP.q.get('demo') === '1';
  var FROM = Math.max(0, Math.min(20, +(IDP.q.get('from') || 6))), TO = Math.max(FROM + 4, Math.min(24, +(IDP.q.get('to') || 24))), HH = 34;
  var W = ['일', '월', '화', '수', '목', '금', '토'];
  var day = IDP.now(); day.setHours(0, 0, 0, 0);
  var items = [], sel = null, seq = 0;
  var FIXED = { '일': '#6fa3d8', '공부': '#a58ad6', '건강': '#7cc4a0', '집': '#e8b46a', '관계': '#e07a8a', '나': '#7fc6c9', '콘텐츠': '#d98fc4', '미팅': '#8aa0e0' };
  var TONES = ['#e07a8a', '#6fa3d8', '#7cc4a0', '#e8b46a', '#a58ad6', '#7fc6c9'];
  function tone(n) { if (!n) return '#9a9a96'; if (FIXED[n]) return FIXED[n]; var h = 0; for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0; return TONES[h % TONES.length]; }
  function col(n, a) { return 'color-mix(in srgb, ' + tone(n) + ' ' + a + '%, var(--deep))'; }
  function soft(n) { return 'color-mix(in srgb, ' + tone(n) + ' 22%, var(--paper))'; }
  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function hm(s) { var d = new Date(s); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function hours(s) { var d = new Date(s); return d.getHours() + d.getMinutes() / 60; }
  function mins(a, b) { return Math.max(0, (Date.parse(b) - Date.parse(a)) / 60000); }
  function nowIso() { var d = new Date(), o = -d.getTimezoneOffset(); return iso(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':00' + (o >= 0 ? '+' : '-') + pad(Math.floor(Math.abs(o) / 60)) + ':' + pad(Math.abs(o) % 60); }
  function state(t) { $('state').textContent = t || ''; }
  if (S.popup()) throw new Error('popup');
  S.onConnect(function () { load(); });
  function gate(html, btn) { $('gate').hidden = false; $('body').hidden = true; $('gate').innerHTML = html + (btn ? '<br><button type="button" id="go">' + btn + '</button>' : ''); if (btn) $('go').onclick = function () { S.connect(); }; }

  function draw() {
    $('badge').textContent = IDP.opt('timetable', 'label', '') || 'Timetable';
    $('day').textContent = (day.getMonth() + 1) + '월 ' + day.getDate() + '일 (' + W[day.getDay()] + ')';
    var G = $('grid'); G.innerHTML = '';
    for (var h = FROM; h < TO; h++) { var r = document.createElement('div'); r.className = 'hr'; r.innerHTML = '<b>' + pad(h % 24) + '</b>'; G.appendChild(r); }
    var timed = items.filter(function (it) { return it.start; }), loose = items.filter(function (it) { return !it.start; });
    timed.forEach(function (it) {
      var a = hours(it.start), b = it.end ? hours(it.end) + (new Date(it.end).getDate() !== new Date(it.start).getDate() ? 24 : 0) : a + .5;
      if (b <= FROM || a >= TO) return;
      a = Math.max(a, FROM); b = Math.min(Math.max(b, a + .5), TO);
      var el = document.createElement('div'); el.className = 'blk' + (it.done ? ' done' : '') + (sel === it.id ? ' sel' : '');
      el.style.top = ((a - FROM) * HH + 1) + 'px'; el.style.height = Math.max(18, (b - a) * HH - 2) + 'px';
      el.style.background = soft(it.area); el.style.boxShadow = 'inset 3px 0 0 ' + col(it.area, 72);
      var t = document.createElement('div'); t.className = 't'; t.textContent = it.title || '(제목 없음)'; el.appendChild(t);
      if ((b - a) * HH > 30) { var m = document.createElement('div'); m.className = 'm'; m.textContent = hm(it.start) + (it.end ? ' – ' + hm(it.end) : '') + (it.area ? ' · ' + it.area : ''); el.appendChild(m); }
      if (it.actual && it.actual.start) {   // 실제로 한 시간 — 오른쪽 가는 막대
        var x = Math.max(hours(it.actual.start), FROM), y = it.actual.end ? Math.min(hours(it.actual.end), TO) : (iso(day) === iso(IDP.now()) ? Math.min(IDP.now().getHours() + IDP.now().getMinutes() / 60, TO) : x + .1);
        var ac = document.createElement('div'); ac.className = 'act'; ac.style.top = ((x - a) * HH) + 'px'; ac.style.height = Math.max(3, (y - x) * HH) + 'px'; el.appendChild(ac);
      }
      el.onclick = function () { sel = sel === it.id ? null : it.id; draw(); };
      G.appendChild(el);
    });
    if (iso(day) === iso(IDP.now())) { var n = IDP.now(), nh = n.getHours() + n.getMinutes() / 60; if (nh >= FROM && nh < TO) { var ln = document.createElement('div'); ln.className = 'now'; ln.style.top = ((nh - FROM) * HH) + 'px'; G.appendChild(ln); } }
    var L = $('loose'); L.innerHTML = '';
    loose.slice(0, 8).forEach(function (it) { var s = document.createElement('span'); s.textContent = it.title; L.appendChild(s); });
    drawBar(); drawReport(timed);
  }
  function drawBar() {
    var B = $('bar'), it = items.filter(function (x) { return x.id === sel; })[0];
    B.hidden = !it; B.innerHTML = ''; if (!it) return;
    var who = document.createElement('div'); who.className = 'who'; who.textContent = it.title;
    var sm = document.createElement('small'); sm.textContent = it.actual && it.actual.start ? '실제 ' + hm(it.actual.start) + (it.actual.end ? ' – ' + hm(it.actual.end) : ' – 진행 중') : '아직 시작 안 함';
    who.appendChild(sm); B.appendChild(who);
    var running = it.actual && it.actual.start && !it.actual.end;
    [['start', '▶ 시작', !running], ['end', '■ 끝', true]].forEach(function (x) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = x[1]; if ((x[0] === 'end') === !!running) b.className = 'go';
      b.onclick = function () { stamp(it, x[0]); }; B.appendChild(b);
    });
  }
  function drawReport(timed) {
    var by = {}, plan = 0, act = 0;
    timed.forEach(function (it) {
      var a = it.area || '기타', p = it.end ? mins(it.start, it.end) : 0, q = it.actual && it.actual.start && it.actual.end ? mins(it.actual.start, it.actual.end) : 0;
      (by[a] = by[a] || { p: 0, q: 0 }); by[a].p += p; by[a].q += q; plan += p; act += q;
    });
    var keys = Object.keys(by); $('rep').hidden = !keys.length; if (!keys.length) return;
    var h = function (m) { return m >= 60 ? (Math.round(m / 6) / 10) + '시간' : Math.round(m) + '분'; };
    $('sum').innerHTML = ''; $('sum').appendChild(document.createTextNode('계획 ')); var b1 = document.createElement('b'); b1.textContent = h(plan); $('sum').appendChild(b1);
    $('sum').appendChild(document.createTextNode(' · 실제 ')); var b2 = document.createElement('b'); b2.textContent = act ? h(act) : '—'; $('sum').appendChild(b2);
    var max = Math.max.apply(null, keys.map(function (k) { return Math.max(by[k].p, by[k].q); })) || 1, R = $('rows'); R.innerHTML = '';
    keys.sort(function (x, y) { return by[y].p - by[x].p; }).forEach(function (k) {
      var row = document.createElement('div'); row.className = 'row';
      var nm = document.createElement('span'); nm.textContent = k;
      var tr = document.createElement('div'); tr.className = 'tr'; var i = document.createElement('i'); i.style.width = (by[k].p / max * 100) + '%'; i.style.background = col(k === '기타' ? '' : k, 60); tr.appendChild(i);
      if (by[k].q) { var u = document.createElement('u'); u.style.width = (by[k].q / max * 100) + '%'; tr.appendChild(u); }
      var hh = function (m) { return (Math.round(m / 6) / 10) + 'h'; };
      var v = document.createElement('span'); v.textContent = hh(by[k].p) + (by[k].q ? ' / ' + hh(by[k].q) : '');
      row.appendChild(nm); row.appendChild(tr); row.appendChild(v); R.appendChild(row);
    });
  }
  function stamp(it, what) {
    var before = it.actual ? { start: it.actual.start, end: it.actual.end } : null, at = DEMO ? (iso(day) + 'T' + pad(IDP.now().getHours()) + ':' + pad(IDP.now().getMinutes()) + ':00') : nowIso();
    if (what === 'start') it.actual = { start: at, end: null }; else it.actual = { start: (before && before.start) || at, end: at };
    draw(); if (DEMO) return;
    S.api('PATCH', '/v1/todo/' + it.id, { actual: what, at: at }).then(function (p) { if (p && p.actual) it.actual = p.actual; draw(); })
      .catch(function (e) { it.actual = before; draw(); state(e.code === 'no_actual' ? '할 일 표에 「실제 시간」 칸이 없어요.' : e.code === 'end_before_start' ? '끝이 시작보다 앞이에요.' : (e.message || '노션에 저장하지 못했어요')); });
  }
  function demo() {
    var d = iso(day), at = function (h, m) { return d + 'T' + pad(h) + ':' + pad(m) + ':00'; };
    return [
      { id: 'a', title: '영어 공부', area: '공부', start: at(7, 0), end: at(8, 30), actual: { start: at(7, 10), end: at(8, 20) }, done: true },
      { id: 'b', title: '팀 주간 회의', area: '일', start: at(10, 0), end: at(11, 0), actual: { start: at(10, 0), end: at(11, 10) }, done: true },
      { id: 'c', title: '기획서 작성', area: '일', start: at(13, 0), end: at(15, 0), actual: { start: at(13, 20), end: at(15, 10) }, done: true },
      { id: 'd', title: '러닝', area: '건강', start: at(19, 0), end: at(19, 40), actual: { start: at(19, 5), end: at(19, 45) }, done: true },
      { id: 'e', title: '상세페이지 초안 쓰기', area: '일', start: at(20, 0), end: at(22, 0), actual: { start: at(20, 10), end: null }, done: false },
      { id: 'f', title: '친구 생일 선물 고르기', area: '관계', done: false }
    ];
  }
  function load() {
    $('gate').hidden = true; $('body').hidden = false; draw();
    if (DEMO) { items = demo(); draw(); state('견본 · 노션과 연결하면 그날 일정 · 시간 블록이 시간 칸에 보여요'); return; }
    if (!S.base) return gate('노션 연결 준비 중이에요.');
    if (!S.wid()) return gate('할 일 표의 그날 일정 · 시간 블록이 시간 칸에 그대로 보여요.<br>칸을 누르고 ▶ 시작 · ■ 끝 — 실제로 한 시간이 저절로 적혀요.', '노션과 연결하기');
    var my = ++seq; state('불러오는 중…');
    S.api('GET', '/v1/todo?date=' + iso(day) + '&tz=' + new Date().getTimezoneOffset()).then(function (d) { if (my !== seq) return; items = d.items || []; state(''); draw(); })
      .catch(function (e) {
        if (my !== seq) return; state('');
        if (e.code === 'not_connected' || e.code === 'notion_revoked') return gate('노션 연결이 끊겼어요.', '다시 연결하기');
        if (e.code === 'choose_planner') { gate('연결된 플래너가 여러 개예요. 이 위젯이 쓸 플래너를 골라 주세요.'); return S.choosePlanner($('gate'), load); }
        if (e.code === 'no_planner' || e.code === 'not_shared') return gate('플래너 페이지를 노션 연결 목록에 넣어 주세요.', '다시 연결하기');
        state(e.message);
      });
  }
  function move(n) { if (n) day.setDate(day.getDate() + n); else { day = IDP.now(); day.setHours(0, 0, 0, 0); } sel = null; items = []; load(); }
  $('prev').onclick = function () { move(-1); };
  $('next').onclick = function () { move(1); };
  $('day').onclick = function () { move(0); };
  setInterval(function () { if (!document.hidden && iso(day) === iso(IDP.now())) draw(); }, 60000);   // 지금 선 · 진행 중 막대
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !DEMO && S.wid() && S.base) load(); });
  IDP.options('timetable', [{ k: 'label', label: '제목', ph: 'Timetable' }], function () { draw(); });
  load();
</script>
</body>
</html>
