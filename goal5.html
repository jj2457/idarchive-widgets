<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · 5-STEP GOAL</title>
<link rel="stylesheet" href="assets/core.css">
<style>
  .goal { font-family: var(--serif); font-size: 19px; letter-spacing: .01em; color: var(--ink); margin-top: 12px; line-height: 1.4; }
  .goal input { font: inherit; color: inherit; background: none; border: 0; width: 100%; padding: 0; }
  .goal input:focus { outline: none; }
  .rail { margin-top: 14px; display: flex; align-items: center; gap: 5px; }
  .node { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--paper);
          font-size: 9px; color: var(--sub); display: flex; align-items: center; justify-content: center; }
  .node.on { background: var(--soft); border-color: var(--soft); color: color-mix(in srgb, var(--deep) 60%, #2a2a2a); }
  .link { flex: 1; height: 1px; background: var(--line); }
  .link.on { background: var(--soft); }
  .steps { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
  .s { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; }
  .s .k { font-size: 9px; letter-spacing: .12em; color: var(--sub); padding-top: 8px; }
  .s input { font: inherit; font-size: 13px; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--line);
             padding: 6px 2px; width: 100%; border-radius: 0; }
  .s input:focus { outline: none; border-bottom-color: var(--soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 3px; }
  .chips button { font-size: 10px; letter-spacing: .04em; padding: 4px 9px; border-radius: 999px; background: none; }
  .chips button.on { background: var(--soft); border-color: var(--soft); }
  .last { display: grid; grid-template-columns: 1fr 74px; gap: 8px; }
  .foot { margin-top: 12px; display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--sub); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="badge">5-STEP GOAL</div><span class="caps" id="pct"></span></div>
  <div class="grow">
    <div class="goal"><input type="text" id="title" placeholder="이루고 싶은 것"></div>
    <div class="rail" id="rail"></div>
    <div class="steps" id="steps"></div>
  </div>
  <div class="foot"><span id="hint">한 칸씩 채우면 목표가 매일로 내려옵니다</span><span id="due"></span></div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js"></script>
<script>
  // The planner's own 5-STEPS GOAL page, measured from the 2027 sale PDF (docs/ORIGINAL_PLANNER_STRUCTURE.md):
  // the five columns are the goal's horizon, its category, this year's goal, how it will be done,
  // and the daily habit with a deadline. It is not a Why/Plan/Action/Review sheet — that was invented.
  var TERMS = ['1년 목표', '5년 목표', '10년 목표'];
  var AREAS = ['커리어', '돈', '건강', '관계', '성장', '일상'];
  // key, label, placeholder — the order is the page's column order, left to right
  var STEPS = [
    ['term', '기간', ''],
    ['area', '분야', ''],
    ['year', '올해 목표', '올해 안에 어디까지'],
    ['how', '실행 방법', '어떻게 할 것인가'],
    ['habit', '매일 할 습관', '매일 무엇을 하면 가까워지나']
  ];
  var KEY = '';
  function readOpts() { KEY = 'idarchive.goal5.' + (IDP.q.get('id') || IDP.opt('goal5', 'title', 'main')); }
  readOpts();
  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (v) return v;
    } catch (e) { /* storage blocked */ }
    var d = IDP.seed(), t = {};
    ['title'].concat(STEPS.map(function (s) { return s[0]; })).forEach(function (k, i) { if (d[i]) t[k] = d[i]; });
    if (IDP.q.get('due')) t.due = IDP.q.get('due');
    return t;
  }
  var st = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function filled(k) { return !!(st[k] || '').trim(); }

  function chipRow(key, values) {
    var box = document.createElement('div');
    box.className = 'chips';
    values.forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = v;
      if (st[key] === v) b.className = 'on';
      b.onclick = function () { st[key] = st[key] === v ? '' : v; save(); render(); };
      box.appendChild(b);
    });
    return box;
  }

  function render() {
    var t = document.getElementById('title');
    if (document.activeElement !== t) t.value = st.title || '';
    var done = STEPS.filter(function (s) { return filled(s[0]); }).length;
    document.getElementById('pct').textContent = Math.round(done / STEPS.length * 100) + '%';

    var rail = document.getElementById('rail');
    rail.innerHTML = '';
    STEPS.forEach(function (s, i) {
      if (i) { var l = document.createElement('div'); l.className = 'link' + (filled(STEPS[i - 1][0]) ? ' on' : ''); rail.appendChild(l); }
      var n = document.createElement('div');
      n.className = 'node' + (filled(s[0]) ? ' on' : '');
      n.textContent = i + 1; n.title = s[1];
      rail.appendChild(n);
    });

    var box = document.getElementById('steps');
    box.innerHTML = '';
    STEPS.forEach(function (s, i) {
      var row = document.createElement('div'); row.className = 's';
      var k = document.createElement('div'); k.className = 'k'; k.textContent = s[1];
      row.appendChild(k);
      if (s[0] === 'term') { row.appendChild(chipRow('term', TERMS)); }
      else if (s[0] === 'area') { row.appendChild(chipRow('area', AREAS)); }
      else if (s[0] === 'habit') {
        var wrap = document.createElement('div'); wrap.className = 'last';
        var inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = s[2]; inp.value = st.habit || '';
        inp.oninput = function () { st.habit = inp.value; save(); paint(); };
        var day = document.createElement('input'); day.type = 'date'; day.value = st.due || '';
        day.setAttribute('aria-label', '마감일');
        day.onchange = function () { st.due = day.value; save(); render(); };
        wrap.appendChild(inp); wrap.appendChild(day);
        row.appendChild(wrap);
      } else {
        var i2 = document.createElement('input'); i2.type = 'text'; i2.placeholder = s[2]; i2.value = st[s[0]] || '';
        i2.oninput = function () { st[s[0]] = i2.value; save(); paint(); };
        row.appendChild(i2);
      }
      box.appendChild(row);
    });

    var d = IDP.parseDate(st.due || '');
    if (d) {
      var today = IDP.now(); today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      var diff = Math.round((d - today) / 864e5);
      document.getElementById('due').textContent = diff === 0 ? 'D-DAY' : diff > 0 ? 'D-' + diff : 'D+' + (-diff);
    } else { document.getElementById('due').textContent = ''; }
  }
  // typing must not rebuild the rows (it would steal focus); only the rail and the count move
  function paint() {
    var done = STEPS.filter(function (s) { return filled(s[0]); }).length;
    document.getElementById('pct').textContent = Math.round(done / STEPS.length * 100) + '%';
    var nodes = document.querySelectorAll('.rail .node'), links = document.querySelectorAll('.rail .link');
    STEPS.forEach(function (s, i) {
      if (nodes[i]) nodes[i].className = 'node' + (filled(s[0]) ? ' on' : '');
      if (i && links[i - 1]) links[i - 1].className = 'link' + (filled(STEPS[i - 1][0]) ? ' on' : '');
    });
  }
  document.getElementById('title').oninput = function () { st.title = this.value; save(); };

  IDP.options('goal5', [
    { k: 'title', label: '이 위젯의 이름 (여러 개 쓸 때)', ph: 'main' },
  ], function () { readOpts(); st = load(); render(); });
  render();
</script>
</body>
</html>
