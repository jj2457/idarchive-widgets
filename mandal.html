<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Mandal-art</title>
<link rel="stylesheet" href="assets/core.css">
<style>
  /* The board stays square whatever the column width: a wide embed centres it instead of stretching it. */
  .grid { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;
          max-width: 340px; margin-left: auto; margin-right: auto; }
  .cell { position: relative; }
  /* the text sits in the middle of its cell both ways, as it is printed on the page */
  .cell .box { aspect-ratio: 1; background: var(--tint); border: 1px solid var(--line);
               border-radius: calc(var(--r) * .4); display: flex; align-items: center; justify-content: center;
               padding: 5px; overflow: hidden; }
  .cell .box > div { width: 100%; text-align: center; font-size: 11px; line-height: 1.35; color: var(--ink); word-break: keep-all; }
  .cell .box > div:focus { outline: none; }
  .cell .box > div:empty::before { content: attr(data-ph); color: var(--sub); opacity: .7; }
  .cell .box:focus-within { border-color: var(--soft); background: var(--paper); }
  .cell.mid .box { background: var(--soft); border-color: var(--soft); }
  .foot { margin-top: 12px; font-size: 11px; color: var(--sub); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="badge">MANDAL-ART</div><span class="caps" id="filled"></span></div>
  <div class="grow"><div class="grid" id="grid"></div></div>
  <div class="foot">가운데에 목표, 둘레 여덟 칸에 그것을 이루는 일 · 이 기기에 저장돼요</div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js"></script>
<script>
  // The planner's mandal-art page in one card: one goal in the middle, eight moves around it.
  var KEY = '';
  function readOpts() { KEY = 'idarchive.mandal.' + (IDP.q.get('id') || IDP.opt('mandal', 'title', 'main')); }
  readOpts();
  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (v) return v;
    } catch (e) { /* storage blocked */ }
    return IDP.seed().slice(0, 9);
  }
  var cells = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(cells)); } catch (e) {} }
  function render() {
    var box = document.getElementById('grid');
    box.innerHTML = '';
    for (var i = 0; i < 9; i++) (function (i) {
      var c = document.createElement('div');
      c.className = 'cell' + (i === 4 ? ' mid' : '');
      var cellBox = document.createElement('div'); cellBox.className = 'box';
      var t = document.createElement('div');
      t.contentEditable = 'true';
      t.setAttribute('role', 'textbox');
      t.setAttribute('data-ph', i === 4 ? '목표' : '');
      t.textContent = cells[i] || '';
      t.oninput = function () { cells[i] = t.textContent; save(); count(); };
      cellBox.appendChild(t);
      c.appendChild(cellBox);
      box.appendChild(c);
    })(i);
    count();
  }
  function count() {
    var n = cells.filter(function (x) { return (x || '').trim(); }).length;
    document.getElementById('filled').textContent = n + ' / 9';
  }
  IDP.options('mandal', [
    { k: 'title', label: '보드 이름', ph: 'main' },
  ], function () { readOpts(); cells = load(); render(); });
  render();
</script>
</body>
</html>
