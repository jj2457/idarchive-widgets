<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Habit Streak</title>
<link rel="stylesheet" href="assets/core.css">
<style>
  .big { font-size: 40px; letter-spacing: .02em; color: var(--ink); line-height: 1; }
  .big small { font-size: 13px; letter-spacing: .1em; color: var(--sub); margin-left: 6px; }
  .dots { margin-top: 14px; display: grid; grid-template-columns: repeat(15, 1fr); gap: 5px; }
  .d { aspect-ratio: 1; border-radius: 50%; background: var(--tint); border: 1px solid var(--line); }
  .d.on { background: var(--soft); border-color: var(--soft); }
  .d.today { box-shadow: 0 0 0 1.5px var(--deep); }
  .act { margin-top: 16px; display: flex; gap: 8px; }
  .act button { flex: 1; padding: 9px 0; font-size: 11px; letter-spacing: .08em; }
  .foot { margin-top: 12px; font-size: 11px; color: var(--sub); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="badge" id="badge">STREAK</div><span class="caps" id="best"></span></div>
  <div class="grow" style="margin-top:14px">
    <div class="big"><span id="n">0</span><small>일째</small></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="act"><button type="button" id="mark">오늘 했어요</button></div>
  <div class="foot">이 기기에 저장돼요 · 하루는 새벽 <span id="fromTxt"></span>시에 바뀝니다</div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js"></script>
<script>
  // A single habit's streak, kept on this device. The Notion-connected habit table stays the source of truth
  // for the planner; this widget is the "don't break the chain" view that sits on a dashboard.
  var FROM = 5, TITLE = 'STREAK', KEY = '';
  function readOpts() {
    TITLE = IDP.opt('streak', 'title', 'STREAK');
    FROM = Math.min(23, Math.max(0, +IDP.opt('streak', 'from', 5) || 5));
    KEY = 'idarchive.streak.' + (IDP.q.get('id') || TITLE);
  }
  readOpts();
  function dayKey(d) {
    d = d || IDP.now();
    var x = new Date(d.getTime());
    if (x.getHours() < FROM) x.setDate(x.getDate() - 1);
    return IDP.iso(x);
  }
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
  }
  var days = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(days.slice(-400))); } catch (e) {} }
  function streak() {
    var n = 0, d = IDP.now();
    if (days.indexOf(dayKey(d)) < 0) d.setDate(d.getDate() - 1);   // today not ticked yet: count up to yesterday
    while (days.indexOf(dayKey(d)) >= 0) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function best() {
    var sorted = days.slice().sort(), run = 0, top = 0, prev = null;
    sorted.forEach(function (k) {
      var d = IDP.parseDate(k);
      run = (prev && (d - prev) === 864e5) ? run + 1 : 1;
      if (run > top) top = run;
      prev = d;
    });
    return top;
  }
  function render() {
    document.getElementById('badge').textContent = TITLE;
    document.getElementById('n').textContent = streak();
    document.getElementById('best').textContent = '최고 ' + best() + '일';
    document.getElementById('fromTxt').textContent = FROM;
    var box = document.getElementById('dots');
    box.innerHTML = '';
    var today = dayKey();
    for (var i = 29; i >= 0; i--) {
      var d = IDP.now(); d.setDate(d.getDate() - i);
      var k = dayKey(d);
      var el = document.createElement('div');
      el.className = 'd' + (days.indexOf(k) >= 0 ? ' on' : '') + (k === today ? ' today' : '');
      el.title = k;
      box.appendChild(el);
    }
    document.getElementById('mark').textContent = days.indexOf(today) >= 0 ? '오늘 취소' : '오늘 했어요';
  }
  document.getElementById('mark').onclick = function () {
    var k = dayKey(), at = days.indexOf(k);
    if (at >= 0) days.splice(at, 1); else days.push(k);
    save(); render();
  };
  IDP.options('streak', [
    { k: 'title', label: '습관 이름', ph: '예) 달리기' },
  ], function () { readOpts(); days = load(); render(); });
  render();
  setInterval(render, 60000);
</script>
</body>
</html>
