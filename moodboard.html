<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Moodboard</title>
<link rel="stylesheet" href="assets/core.css">
<style>
  .stage { margin-top: 12px; position: relative; border-radius: calc(var(--r) * .5); overflow: hidden;
           background: var(--tint); border: 1px solid var(--line); flex: 1; min-height: 140px; }
  .stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           text-align: center; font-size: 11px; line-height: 1.7; color: var(--sub); padding: 0 24px; letter-spacing: .03em; }
  .dots { margin-top: 10px; display: flex; gap: 5px; justify-content: center; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); display: block; }
  .dots i.on { background: var(--deep); }
  .cap { margin-top: 10px; font-size: 11px; color: var(--sub); letter-spacing: .04em; text-align: center; }
</style>
</head>
<body>
<div class="card" style="display:flex;flex-direction:column">
  <div class="row"><div class="badge" id="badge">MOODBOARD</div><span class="caps" id="n"></span></div>
  <div class="stage" id="stage"><div class="empty" id="empty">⚙ 에서 이미지 주소를 넣으면<br>이 자리에서 번갈아 보여줍니다</div></div>
  <div class="dots" id="dots"></div>
  <div class="cap" id="cap"></div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js"></script>
<script>
  // A vision board that actually sits on the dashboard: image links, rotated slowly.
  var urls = [], every = 8, i = 0, tick = null, TITLE = 'MOODBOARD';
  function readOpts() {
    TITLE = IDP.opt('moodboard', 'title', 'MOODBOARD');
    every = Math.max(2, +IDP.opt('moodboard', 'seconds', 8) || 8);
    urls = String(IDP.opt('moodboard', 'urls', '')).split(/[\s,]+/).filter(function (u) { return /^https?:\/\//.test(u); });
  }
  function render() {
    document.getElementById('badge').textContent = TITLE;
    document.getElementById('n').textContent = urls.length ? (i + 1) + ' / ' + urls.length : '';
    var stage = document.getElementById('stage');
    stage.querySelectorAll('img').forEach(function (el) { el.remove(); });
    document.getElementById('empty').style.display = urls.length ? 'none' : 'flex';
    if (urls.length) {
      var img = document.createElement('img');
      img.src = urls[i % urls.length];
      img.alt = '';
      stage.appendChild(img);
    }
    var dots = document.getElementById('dots');
    dots.innerHTML = '';
    urls.forEach(function (_, k) { var d = document.createElement('i'); if (k === i % urls.length) d.className = 'on'; dots.appendChild(d); });
    document.getElementById('cap').textContent = urls.length > 1 ? every + '초마다 바뀝니다' : '';
  }
  function loop() {
    if (tick) clearInterval(tick);
    if (urls.length > 1) tick = setInterval(function () { i = (i + 1) % urls.length; render(); }, every * 1000);
  }
  document.getElementById('stage').onclick = function () { if (urls.length > 1) { i = (i + 1) % urls.length; render(); loop(); } };
  IDP.options('moodboard', [
    { k: 'title', label: '제목', ph: 'MOODBOARD' },
    { k: 'urls', label: '이미지 주소 (쉼표로 구분)', ph: 'https://…' },
    { k: 'seconds', t: 'number', label: '넘기는 간격(초)', ph: '8' },
  ], function () { readOpts(); i = 0; render(); loop(); });
  readOpts(); render(); loop();
</script>
</body>
</html>
