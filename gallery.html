<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Widget Gallery</title>
<style>
  body { margin: 0; padding: 16px; background: #fff; font-family: sans-serif; }
  body.dark { background: #191919; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  iframe { width: 100%; height: 250px; border: 0; }
  iframe.tall { height: 330px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
  // gallery.html?theme=pink&mode=dark — every widget in one colour, for checking a theme at a glance
  var q = location.search || '?theme=lavender';
  if (/mode=dark/.test(q)) document.body.className = 'dark';
  var extra = { calendar: '&style=editorial', dday: '&title=2027 새해&date=2027-01-01', quote: '&text=꿈을 계획으로, 계획을 하루로&by=ID PLANNER' };
  ['clock', 'week', 'calendar', 'timeline', 'top3', 'routine', 'water', 'checkin', 'streak', 'mood', 'journal', 'memo',
   'focus', 'timer', 'progress', 'dday', 'year', 'focusnote', 'goalprogress', 'reading', 'review', 'mandal', 'quote', 'moodboard', 'goal5', 'vision', 'roadmap', 'bucket'].forEach(function (w) {
    var f = document.createElement('iframe');
    f.src = w + '.html' + q + (extra[w] || ''); f.title = w;
    if (['calendar','focus','progress','year','routine','mood','mandal','streak','journal','timer','moodboard','focusnote','checkin','goalprogress','reading','review','goal5','vision','roadmap','bucket'].indexOf(w) >= 0) f.className = 'tall';
    document.getElementById('grid').appendChild(f);
  });
</script>
</body>
</html>
