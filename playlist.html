<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Playlist</title>
<link rel="stylesheet" href="assets/core.css?v=r6c">
<style>
  .wrap { max-width: 520px; }
  .player { margin-top: 12px; border-radius: 16px; background: var(--tint); padding: 14px 14px 12px; }
  .screen { display: flex; align-items: center; gap: 12px; }
  .disc { flex: none; width: 46px; height: 46px; border-radius: 50%;
          background: radial-gradient(circle, var(--paper) 0 17%, var(--deep) 18% 22%, var(--soft) 23% 100%);
          box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--deep) 35%, transparent); }
  .disc.spin { animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .disc.spin { animation: none; } }
  .now { min-width: 0; flex: 1; }
  .now .t { font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now .h { font-size: 10px; color: var(--sub); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { margin-top: 12px; height: 3px; border-radius: 3px; background: color-mix(in srgb, var(--deep) 18%, transparent); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 38%; background: var(--deep); border-radius: 3px; }
  .ctl { margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 16px; }
  .ctl button { border: 0; background: transparent; padding: 4px; color: color-mix(in srgb, var(--deep) 60%, #2a2a2a); cursor: pointer; }
  .ctl .play { width: 38px; height: 38px; border-radius: 50%; background: var(--deep); color: #fff; display: flex; align-items: center; justify-content: center; }
  .ctl svg { display: block; }
  ol { list-style: none; margin: 10px 0 0; padding: 0; }
  ol li { display: flex; align-items: center; gap: 9px; padding: 7px 4px; border-bottom: 1px solid var(--line); font-size: 12px; cursor: pointer; }
  ol li:last-child { border-bottom: 0; }
  ol li .no { flex: none; width: 18px; font-size: 10px; color: var(--sub); text-align: right; }
  ol li .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol li.on { color: color-mix(in srgb, var(--deep) 60%, #2a2a2a); font-weight: 500; }
  .empty { margin-top: 18px; text-align: center; font-size: 11.5px; color: var(--sub); line-height: 1.8; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="badge" id="badge">READING PLAYLIST</div><span class="caps" id="count"></span></div>
  <div class="grow"><div class="wrap">
    <div class="player" id="player" hidden>
      <div class="screen">
        <div class="disc" id="disc"></div>
        <div class="now"><div class="t" id="nowT"></div><div class="h" id="nowH"></div></div>
      </div>
      <div class="bar"><i></i></div>
      <div class="ctl">
        <button id="prev" aria-label="이전 곡"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5 9 12l10 7z"/><path d="M5 5v14"/></svg></button>
        <button class="play" id="play" aria-label="열기"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="next" aria-label="다음 곡"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 10 7-10 7z"/><path d="M19 5v14"/></svg></button>
      </div>
    </div>
    <ol id="list"></ol>
    <div class="empty" id="empty" hidden>⚙ 에서 이름과 링크를 하나씩 넣으면<br>플레이리스트가 됩니다.</div>
  </div></div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js?v=r6c"></script>
<script>
  // A playlist of links — nothing is played or recorded here. ▶ opens the chosen link (YouTube, Spotify, Melon …)
  // in a new tab. The list lives in the widget's own settings (⚙ / the embed link), like LINKS.
  var LIST = [], cur = 0;
  function readOpts() {
    LIST = IDP.listParse(IDP.opt('playlist', 'items', ''), 2).map(function (f) {
      return f[0] && /^https?:\/\//.test(f[1]) ? { n: f[0], u: f[1] } : null;
    }).filter(Boolean).slice(0, 12);
    if (cur >= LIST.length) cur = 0;
  }
  function host(u) { try { return new URL(u).hostname.replace(/^www\.|^m\./, ''); } catch (e) { return ''; } }
  function open(i) { var l = LIST[i]; if (l) window.open(l.u, '_blank', 'noopener,noreferrer'); }
  function render() {
    document.getElementById('badge').textContent = IDP.opt('playlist', 'label', 'READING PLAYLIST');
    var has = !!LIST.length;
    document.getElementById('player').hidden = !has;
    document.getElementById('empty').hidden = has;
    document.getElementById('count').textContent = has ? (LIST.length + '곡') : '';
    if (has) {
      document.getElementById('nowT').textContent = LIST[cur].n;
      document.getElementById('nowH').textContent = host(LIST[cur].u);
    }
    var ol = document.getElementById('list');
    ol.innerHTML = '';
    LIST.forEach(function (l, i) {
      var li = document.createElement('li');
      if (i === cur) li.className = 'on';
      var no = document.createElement('span'); no.className = 'no'; no.textContent = String(i + 1).padStart(2, '0');
      var n = document.createElement('span'); n.className = 'n'; n.textContent = l.n;
      li.appendChild(no); li.appendChild(n);
      li.onclick = function () { cur = i; render(); open(i); };
      ol.appendChild(li);
    });
  }
  document.getElementById('play').onclick = function () { document.getElementById('disc').classList.add('spin'); open(cur); };
  document.getElementById('prev').onclick = function () { if (LIST.length) { cur = (cur - 1 + LIST.length) % LIST.length; render(); } };
  document.getElementById('next').onclick = function () { if (LIST.length) { cur = (cur + 1) % LIST.length; render(); } };
  IDP.options('playlist', [
    { k: 'label', label: '제목', ph: 'READING PLAYLIST' },
    { k: 'items', t: 'list', label: '곡 · 플레이리스트 (최대 12개)', max: 12,
      fields: [{ label: '이름', ph: '비 오는 날 재즈' }, { label: '링크 — 유튜브 · 스포티파이 · 멜론 주소', url: true, ph: 'https://youtube.com/…' }] }
  ], function () { readOpts(); render(); });
  readOpts();
  render();
</script>
</body>
</html>
