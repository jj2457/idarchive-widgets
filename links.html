<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Links</title>
<link rel="stylesheet" href="assets/core.css">
<style>
  .wrap { max-width: 560px; }
  .grid { margin-top: 12px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
  .grid.one { grid-template-columns: 1fr; }
  a.item { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 11px;
           background: var(--tint); text-decoration: none; color: var(--ink); min-width: 0; }
  a.item:hover { background: var(--soft); }
  a.item .ini { flex: none; width: 22px; height: 22px; border-radius: 7px; background: var(--paper);
                display: flex; align-items: center; justify-content: center;
                font-size: 10px; letter-spacing: 0; color: color-mix(in srgb, var(--deep) 60%, #2a2a2a); }
  a.item .tx { min-width: 0; }
  a.item .n { font-size: 12px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.item .h { font-size: 9.5px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { margin-top: 20px; text-align: center; font-size: 11.5px; color: var(--sub); line-height: 1.8; }
  .foot { margin-top: 12px; display: flex; justify-content: space-between; gap: 10px;
          font-size: 11px; color: var(--sub); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="badge" id="badge">LINKS</div><span class="caps" id="count"></span></div>
  <div class="grow"><div class="wrap">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>⚙ 에서 <b>이름|주소</b> 로 적으면 버튼이 됩니다.<br>예) 노션|https://notion.so, 메일|https://mail.google.com</div>
  </div></div>
  <div class="foot"><span id="hint">자주 여는 곳을 한 자리에</span><span>새 탭에서 열립니다</span></div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js"></script>
<script>
  // Shortcuts, nothing more. No favicon fetching — that would call out to every site in the list from
  // the buyer's browser, so the tile shows the first letter of the name instead.
  var LINKS = [];
  function readOpts() {
    LINKS = String(IDP.opt('links', 'items', ''))
      .split(',').map(function (p) {
        var at = p.indexOf('|');
        if (at < 0) return null;
        var n = p.slice(0, at).trim(), u = p.slice(at + 1).trim();
        if (!n || !/^https?:\/\//.test(u)) return null;
        return { n: n, u: u };
      }).filter(Boolean).slice(0, 10);
  }
  readOpts();

  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }

  function render() {
    document.getElementById('badge').textContent = IDP.opt('links', 'label', 'LINKS');
    var one = String(IDP.opt('links', 'cols', '2')) === '1';
    var grid = document.getElementById('grid');
    grid.className = 'grid' + (one ? ' one' : '');
    grid.innerHTML = '';
    document.getElementById('empty').hidden = !!LINKS.length;
    document.getElementById('count').textContent = LINKS.length ? (LINKS.length + '개') : '';
    LINKS.forEach(function (l) {
      var a = document.createElement('a');
      a.className = 'item'; a.href = l.u; a.target = '_blank'; a.rel = 'noopener noreferrer';
      var ini = document.createElement('span');
      ini.className = 'ini'; ini.textContent = l.n.trim().charAt(0).toUpperCase();
      var tx = document.createElement('span'); tx.className = 'tx';
      var n = document.createElement('div'); n.className = 'n'; n.textContent = l.n;
      var h = document.createElement('div'); h.className = 'h'; h.textContent = host(l.u);
      tx.appendChild(n); tx.appendChild(h);
      a.appendChild(ini); a.appendChild(tx);
      grid.appendChild(a);
    });
  }
  IDP.options('links', [
    { k: 'label', label: '제목', ph: 'LINKS' },
    { k: 'items', label: '바로가기 (이름|주소, 쉼표로 구분, 최대 10개)', ph: '노션|https://notion.so' },
    { k: 'cols', label: '한 줄에 몇 개 (1 또는 2)', ph: '2' }
  ], function () { readOpts(); render(); });
  render();
</script>
</body>
</html>
