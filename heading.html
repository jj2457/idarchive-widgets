<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Section Title</title>
<link rel="stylesheet" href="assets/core.css?v=r62">
<style>
  /* 구역 제목(오너 2026-10-02 REQ-134 「가운데 정렬 제목 · 구분선 색 · 포장도 중요」 · REQ-133 「위젯 넣는 자리 틀」).
     노션 글은 가운데 정렬이 안 되고 색을 테마에 맞춰 바꿀 수 없어서, 구역 머리만 이 작은 위젯으로 — 9색 · 나만의 색 · 저장한 색 · 테마 적용을 그대로 따른다.
     t = 제목(영문 대문자 권장) · s = 아래 작은 한 줄(선택) · style = mark(형광 밑줄, 기본) · line(양옆 선) · plain
     글은 textContent 로만 넣는다(HTML 아님). 칸 하나에 꼭 맞게(가로 넘침 없음 · 폭 375 에서도 한 줄). */
  html, body { height: 100%; background: transparent; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 10px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; width: 100%; justify-content: center; }
  .ln { flex: 1 1 0; max-width: 140px; height: 1px; background: color-mix(in srgb, var(--deep) 45%, transparent); display: none; }
  [data-style="line"] .ln { display: block; }
  .t { font-family: var(--serif); font-size: clamp(14px, 3.4vw, 20px); letter-spacing: .26em; text-transform: uppercase; white-space: nowrap;
       color: color-mix(in srgb, var(--deep) 62%, #2f2f2f); padding: 0 .1em 0 .36em; position: relative; z-index: 0; }
  [data-style="mark"] .t::after { content: ''; position: absolute; left: 0; right: 0; bottom: .08em; height: .52em; background: var(--soft); opacity: .75; z-index: -1; border-radius: 2px; }
  .s { margin-top: 5px; font-size: 11.5px; letter-spacing: .04em; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .s:empty { display: none; }
  .rule { width: 100%; height: 1px; margin-top: 9px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--deep) 35%, transparent) 18%, color-mix(in srgb, var(--deep) 35%, transparent) 82%, transparent); }
  [data-style="line"] .rule, [data-style="plain"] .rule, [data-rule="0"] .rule { display: none; }
  :root[data-mode="dark"] .t { color: color-mix(in srgb, var(--soft) 70%, #ffffff); }
  /* style=module (R2 HOME 2026-10-06 「모듈마다 분명한 제목 · 작은 선 아이콘 · 요약」): 왼쪽 정렬 한 줄 — 아이콘 칩 · 제목 · 오른쪽 작은 요약(s), 아래 머리카락 선.
     i = 아이콘(today · week · goal · habit · focus · month · project · reading · money · time) */
  [data-style="module"] body, body[data-style="module"] { align-items: stretch; padding: 4px 6px 0; }
  .mod { display: none; align-items: center; gap: 10px; width: 100%; min-width: 0; }
  [data-style="module"] .row, [data-style="module"] > .s { display: none; }
  [data-style="module"] .mod { display: flex; }
  .ic { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--soft) 55%, #ffffff); }
  .ic svg { width: 17px; height: 17px; fill: none; stroke: var(--deep); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .mt { font-family: var(--serif); font-size: 15px; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; color: color-mix(in srgb, var(--deep) 45%, #2f2b27); }
  .ms { margin-left: auto; font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding-left: 10px; }
  /* R6 (2026-10-06) 좁은 반칸(HOME CURRENT GOAL · FOCUS ≈ 200px)에서 제목이 「CURRENT GO」로 잘림 → 요약을 숨기고 제목 자간만 줄인다 */
  @media (max-width: 280px) { .ms { display: none; } .mt { font-size: 14px; letter-spacing: .12em; overflow: hidden; text-overflow: ellipsis; min-width: 0; } .mod { gap: 8px; } }
  @media (max-width: 200px) { .mt { font-size: 13px; letter-spacing: .07em; } .ic { width: 26px; height: 26px; } .mod { gap: 7px; } }
  @media (max-width: 172px) { .ic { display: none; } }
  [data-style="module"] .rule { margin-top: 10px; background: color-mix(in srgb, var(--deep) 22%, transparent); }
  /* style=label (R5 메뉴 2026-10-06 「IMAGE CENTER = LABEL CENTER = TILE CENTER」): 그림 메뉴 칸 밑 이름표 — 칸 가운데 한 줄, 선 없음.
     누르면 가는 곳은 바로 위 노션 그림 블록의 링크(복제해도 새 페이지로 따라감)가 맡는다 — 이 이름표는 링크를 갖지 않는다.
     노션은 임베드를 최소 100px 로 그린다(2026-10-06 실측) — 이름은 맨 위, 그 밑 작은 한 줄(s), 남는 아래 칸은 줄 사이 여백이 된다 */
  body[data-style="label"] { justify-content: flex-start; padding: 2px 4px 0; }
  [data-style="label"] .t { font-size: 12.5px; letter-spacing: .3em; padding: 0 0 0 .3em; color: color-mix(in srgb, var(--deep) 52%, #2f2b27); }
  [data-style="label"] .s { margin-top: 4px; font-size: 10.5px; letter-spacing: .06em; }
  [data-style="label"] .rule { display: none; }
  /* R6 (2026-10-06) 1280px 화면(칸 약 120px)에서 「VISION BOARD」가 「ISION BOAR」로 잘림 → 좁은 칸은 글자 · 자간을 줄인다 */
  @media (max-width: 190px) { [data-style="label"] .t { font-size: 11px; letter-spacing: .16em; padding-left: .16em; } [data-style="label"] .s { font-size: 9.5px; letter-spacing: 0; } }
  @media (max-width: 135px) { [data-style="label"] .t { font-size: 10px; letter-spacing: .08em; padding-left: .08em; } }
  /* R6.1 한 줄 메뉴(오너 2026-10-07 「2줄 → 1줄 · 작게」) row=1: 칸이 60~100px — 이름은 두 줄까지 감싸고(VISION / BOARD) 작은 한 줄(s)은 숨긴다.
     폰(칸이 세로로 쌓여 위젯이 넓어짐)에서는 노션이 그림을 왼쪽에 붙이므로 이름도 그림 폭(lw)만큼 왼쪽 상자 가운데에 */
  [data-row="1"] .row { max-width: 100%; }
  [data-row="1"] .t { white-space: normal; text-align: center; line-height: 1.3; font-size: 11px; letter-spacing: .16em; padding-left: .16em; word-break: keep-all; color: color-mix(in srgb, var(--deep) 38%, #2a2622); }
  [data-row="1"] .s { display: none; }
  body[data-row="1"] { padding: 0 2px 0; }   /* R6.2 이름표를 그림 바로 밑에(간격 줄이기) */
  @media (max-width: 96px) { [data-row="1"] .t { font-size: 10px; letter-spacing: .08em; padding-left: .08em; } }
  @media (max-width: 66px) { [data-row="1"] .t { font-size: 9.5px; letter-spacing: .03em; padding-left: .03em; } }
  body.stack { align-items: flex-start; }
  body.stack .row { width: var(--lw); }
  /* R6.2 style=step (오너 2026-10-07 「5 STEP 카드 — 박스 안 가운데 · 글자가 넘치지 않게」): n = 「STEP 1」 · t = 제목 · s = 한 줄.
     노션 글 블록은 가운데 정렬이 안 되고 좁은 칸에서 단어 중간이 끊겨서 — 카드 하나를 이 위젯으로. 단어 단위로만 줄바꿈, 넘치면 글자를 줄여 맞춤 */
  .step { display: none; }
  body[data-style="step"] { padding: 3px; justify-content: stretch; }
  [data-style="step"] .row, [data-style="step"] > .s, [data-style="step"] .rule, [data-style="step"] .mod { display: none !important; }
  [data-style="step"] .step, .steps .step { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3px; width: 100%; height: 100%;
    border-radius: 10px; background: color-mix(in srgb, var(--soft) 45%, #ffffff); padding: 8px 6px; box-sizing: border-box; }
  .step .sn { font-size: 10px; letter-spacing: .16em; padding-left: .16em; font-weight: 600; color: color-mix(in srgb, var(--deep) 75%, #3a2f26); }
  .step .st { font-family: var(--serif); font-size: 15px; letter-spacing: .06em; padding-left: .06em; line-height: 1.15; color: color-mix(in srgb, var(--deep) 40%, #2a2622); word-break: keep-all; overflow-wrap: normal; }
  .step .ss { font-size: 11px; line-height: 1.35; color: var(--sub); word-break: keep-all; }
  /* style=steps: 카드 여러 장을 한 위젯 안에 한 줄로(노션 칸 사이 46px 를 없애 카드 폭을 넓힘) — items = 「번호|제목|한 줄」을 쉼표로 */
  .steps { display: none; }
  body[data-style="steps"] { padding: 3px 2px; justify-content: stretch; }
  [data-style="steps"] .row, [data-style="steps"] > .s, [data-style="steps"] .rule, [data-style="steps"] .mod { display: none !important; }
  [data-style="steps"] .steps { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; width: 100%; height: 100%; }
  [data-style="steps"] .steps .step { display: flex; height: 100%; min-width: 0; overflow: hidden; }
  @media (max-width: 420px) { [data-style="steps"] .steps { gap: 5px; } .step .sn { letter-spacing: .06em; padding-left: .06em; } }
  .step .sn { white-space: nowrap; }
  :root[data-mode="dark"] .step .st { color: color-mix(in srgb, var(--soft) 70%, #ffffff); }
  /* 한글 제목(「작은 습관 → 목표 · 연결」 · 「나의 수업」)은 영문 대문자용 넓은 자간이면 글자가 흩어진다(R5 폰 검수 2026-10-06) — 한글이 들어가면 자간을 좁힌다 */
  .ko { letter-spacing: .03em !important; }
</style>
</head>
<body>
<div class="row"><span class="ln"></span><span class="t" id="t"></span><span class="ln"></span></div>
<div class="s" id="s"></div>
<div class="mod"><span class="ic" id="ic" aria-hidden="true"></span><span class="mt" id="mt"></span><span class="ms" id="ms"></span></div>
<div class="step"><span class="sn" id="sn"></span><span class="st" id="st"></span><span class="ss" id="ss"></span></div>
<div class="steps" id="steps"></div>
<div class="rule"></div>
<script src="config/themes.js"></script>
<script src="assets/core.js?v=r62"></script>
<script>
  var st = IDP.q.get('style');
  document.body.dataset.style = /^(mark|line|plain|module|label|step|steps)$/.test(st || '') ? st : 'mark';
  // 작은 선 아이콘(24 그리드 · 테마 포인트 색 선) — 글자 아님, 그림만
  var ICONS = {
    today: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
    week: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4M7.5 13.5h2M11 13.5h2M14.5 13.5h2M7.5 16.5h2"/>',
    month: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="15.5" cy="15" r="1.6"/>',
    goal: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.8"/><circle cx="12" cy="12" r="1.2"/>',
    habit: '<circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>',
    focus: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3.5M12 17.5V21M3 12h3.5M17.5 12H21"/>',
    project: '<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
    reading: '<path d="M12 6.5C9.5 5 6.5 4.6 3.5 5v13c3-.4 6 0 8.5 1.5 2.5-1.5 5.5-1.9 8.5-1.5V5c-3-.4-6 0-8.5 1.5zM12 6.5v13"/>',
    money: '<rect x="3.5" y="6.5" width="17" height="12" rx="2.5"/><path d="M3.5 10.5h17M15.5 14.5h2"/>',
    time: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'
  };
  if (document.body.dataset.style === 'module') {
    var ik = IDP.q.get('i') || 'today';
    document.getElementById('ic').innerHTML = '<svg viewBox="0 0 24 24">' + (ICONS[ik] || ICONS.today) + '</svg>';
    document.getElementById('mt').textContent = (IDP.q.get('t') || 'TODAY').slice(0, 40);
    document.getElementById('ms').textContent = (IDP.q.get('s') || '').slice(0, 60);
  }
  if (IDP.q.get('rule') === '0') document.body.dataset.rule = '0';
  if (document.body.dataset.style === 'step') {
    document.getElementById('sn').textContent = (IDP.q.get('n') || '').slice(0, 20);
    // 하이픈 · 마지막 한 글자 단어에서 줄이 끊기지 않게(MANDAL-ART · 이번 주)
    document.getElementById('st').textContent = (IDP.q.get('t') || '').slice(0, 30).replace(/-/g, '‑');
    document.getElementById('ss').textContent = (IDP.q.get('s') || '').slice(0, 40).replace(/ (\S)$/, ' $1');
    // 넘치면(가로 · 세로) 제목부터 조금씩 줄인다 — 10px 아래로는 줄이지 않는다
    var fitStep = function () {
      var box = document.querySelector('.step'), t = document.getElementById('st'), ss = document.getElementById('ss');
      t.style.fontSize = ''; ss.style.fontSize = '';
      var fs = 15, s2 = 11;
      var over = function () { return box.scrollHeight > box.clientHeight + 1 || [t, ss].some(function (e) { return e.scrollWidth > box.clientWidth - 8; }); };
      while (over() && fs > 10) { fs -= 0.5; t.style.fontSize = fs + 'px'; if (s2 > 10) { s2 -= 0.25; ss.style.fontSize = s2 + 'px'; } }
    };
    fitStep(); addEventListener('resize', fitStep); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitStep);
  }
  if (document.body.dataset.style === 'steps') {
    var wrap = document.getElementById('steps');
    (IDP.q.get('items') || '').split(',').slice(0, 6).forEach(function (it) {
      var f = it.split('|'), c = document.createElement('div'); c.className = 'step';
      [['sn', f[0] || ''], ['st', (f[1] || '').replace(/-/g, '‑')], ['ss', (f[2] || '').replace(/ (\S)$/, ' $1')]].forEach(function (x) { var e = document.createElement('span'); e.className = x[0]; e.textContent = x[1].slice(0, 40); c.appendChild(e); });
      wrap.appendChild(c);
    });
    var fitAll = function () {
      var cards = wrap.children, fs = 15, s2 = 11, n = 10;
      var set = function () { Array.prototype.forEach.call(cards, function (c) { c.querySelector('.st').style.fontSize = fs + 'px'; c.querySelector('.ss').style.fontSize = s2 + 'px'; c.querySelector('.sn').style.fontSize = n + 'px'; }); };
      var over = function () { return Array.prototype.some.call(cards, function (c) { return c.scrollHeight > c.clientHeight + 1 || Array.prototype.some.call(c.children, function (e) { return e.scrollWidth > c.clientWidth - 6; }); }); };
      set();
      while (over() && fs > 9) { fs -= 0.5; if (s2 > 9.5) s2 -= 0.25; if (n > 8.5) n -= 0.25; set(); }
    };
    fitAll(); addEventListener('resize', fitAll); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  }
  if (document.body.dataset.style === 'label' && IDP.q.get('row') === '1') {
    document.body.dataset.row = '1';
    var lw = Math.max(40, Math.min(240, +IDP.q.get('lw') || 96));
    document.body.style.setProperty('--lw', lw + 'px');
    // 칸이 아주 좁으면(1280 · 사이드바 열림 ≈ 22px) 글자가 잘리지 않게 줄여서 맞춘다 — 잘림 0 이 먼저(6px 아래로는 줄이지 않고 음절에서 줄바꿈)
    var te = document.getElementById('t');
    var fit = function () {
      document.body.classList.toggle('stack', innerWidth > lw * 1.6);
      te.style.fontSize = ''; te.style.letterSpacing = ''; te.style.paddingLeft = ''; te.style.wordBreak = '';
      var fs = parseFloat(getComputedStyle(te).fontSize), box = document.body.clientWidth - 4;
      var over = function () { return te.scrollWidth > box || te.getBoundingClientRect().width > box + 0.5; };
      // 자간을 없앨 때 왼쪽 보정(padding-left = 자간)도 같이 없애야 글자 묶음이 칸 가운데(R6.2 「제목 가운데 정렬 실제 비교」)
      while (over() && fs > 6) { fs -= 0.5; te.style.fontSize = fs + 'px'; te.style.letterSpacing = '0'; te.style.paddingLeft = '0'; }
      if (over()) te.style.wordBreak = 'break-all';
    };
    fit(); addEventListener('resize', fit);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  }
  document.getElementById('t').textContent = (IDP.q.get('t') || 'TODAY').slice(0, 40);
  document.getElementById('s').textContent = (IDP.q.get('s') || '').slice(0, 60);
  document.title = 'ID PLANNER · ' + document.getElementById('t').textContent;
  ['t', 'mt'].forEach(function (id) { var e = document.getElementById(id); if (/[ㄱ-힝]/.test(e.textContent)) e.classList.add('ko'); });
</script>
</body>
</html>
