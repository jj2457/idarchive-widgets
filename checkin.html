<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Daily Check-in</title>
<link rel="stylesheet" href="assets/core.css">
<style>
  .lab { font-size: 10px; letter-spacing: .14em; color: var(--sub); margin: 14px 0 7px; }
  .scale { display: flex; gap: 6px; }
  .scale button { flex: 1; padding: 9px 0; font-size: 11px; letter-spacing: .06em; border-radius: calc(var(--r) * .5); }
  .scale button.on { background: var(--soft); border-color: var(--soft); color: var(--ink); }
  .line input { font: inherit; font-size: 14px; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 2px; width: 100%; border-radius: 0; }
  .line input:focus { outline: none; border-bottom-color: var(--soft); }
  .done { margin-top: 16px; display: flex; gap: 8px; align-items: center; }
  .done button { flex: 1; padding: 10px 0; font-size: 11px; letter-spacing: .08em; }
  .done button.on { background: var(--soft); border-color: var(--soft); color: var(--ink); }
  .streak { font-size: 11px; letter-spacing: .06em; color: var(--deep); white-space: nowrap; }
  .foot { margin-top: 10px; font-size: 11px; color: var(--sub); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="badge">CHECK-IN</div><span class="caps" id="date"></span></div>
  <div class="grow">
    <div class="lab">오늘 기분</div>
    <div class="scale" id="mood"></div>
    <div class="lab">에너지</div>
    <div class="scale" id="energy"></div>
    <div class="lab">오늘 한 줄</div>
    <div class="line"><input id="note" type="text" placeholder="오늘을 한 문장으로"></div>
  </div>
  <div class="done">
    <button type="button" id="go">오늘 체크인</button>
    <span class="streak" id="streak"></span>
  </div>
  <div class="foot">이 기기에 저장돼요 · 하루는 새벽 <span id="fromTxt"></span>시에 바뀝니다</div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js"></script>
<script>
  // One ritual instead of three widgets: mood, energy and a line, closed with a single button that builds a streak.
  var FROM = Math.min(23, Math.max(0, +IDP.opt('checkin', 'from', 5) || 5));
  var KEY = 'idarchive.checkin.' + (IDP.q.get('id') || 'v1');
  function dayKey(d) { d = d || IDP.now(); var x = new Date(d.getTime()); if (x.getHours() < FROM) x.setDate(x.getDate() - 1); return IDP.iso(x); }
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
  var all = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) {} }
  function today() { return all[dayKey()] || {}; }
  function set(patch) { var k = dayKey(); all[k] = Object.assign({}, all[k], patch); save(); render(); }
  function streak() {
    var n = 0, d = IDP.now();
    if (!(all[dayKey(d)] || {}).done) d.setDate(d.getDate() - 1);
    while ((all[dayKey(d)] || {}).done) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function chips(box, key) {
    box.innerHTML = '';
    for (var i = 1; i <= 5; i++) (function (i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = i;
      if (today()[key] === i) b.className = 'on';
      b.onclick = function () { var o = {}; o[key] = today()[key] === i ? undefined : i; set(o); };
      box.appendChild(b);
    })(i);
  }
  var note = document.getElementById('note');
  note.oninput = function () { var k = dayKey(); all[k] = Object.assign({}, all[k], { note: note.value }); save(); };
  document.getElementById('go').onclick = function () { set({ done: !today().done }); };
  function render() {
    chips(document.getElementById('mood'), 'm');
    chips(document.getElementById('energy'), 'e');
    if (document.activeElement !== note) note.value = today().note || '';
    var d = IDP.now();
    document.getElementById('date').textContent = IDP.pad(d.getMonth() + 1) + '.' + IDP.pad(d.getDate());
    document.getElementById('fromTxt').textContent = FROM;
    var go = document.getElementById('go');
    go.textContent = today().done ? '오늘 체크인 완료' : '오늘 체크인';
    go.className = today().done ? 'on' : '';
    var n = streak();
    document.getElementById('streak').textContent = n ? n + '일 연속' : '';
  }
  IDP.options('checkin', [], function () { all = load(); render(); });
  render();
  setInterval(function () { if (document.activeElement !== note) render(); }, 60000);
</script>
</body>
</html>
