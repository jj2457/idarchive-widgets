<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · This Month</title>
<link rel="stylesheet" href="assets/core.css">
<style>
  /* 이달의 계절 배너(오너 2026-10-02 「먼슬리가 바뀌면 위쪽이 달별로 자동으로」) — 노션 커버는 날짜로 바뀌지 않으므로,
     MONTHLY 맨 위에 이 위젯을 두면 오늘 날짜의 달 그림이 저절로 보인다. 연결 · 무료 요금제 상관없음. 그림 = 계절 커버와 같은 것 */
  html, body { height: 100%; }
  body { margin: 0; background: transparent; }
  .wrap { position: relative; width: 100%; height: 100%; min-height: 120px; overflow: hidden; border-radius: var(--radius, 18px); background: var(--tint); }
  [data-frame="none"] .wrap { border-radius: 0; }
  .wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; opacity: 0; transition: opacity .35s ease; }
  .wrap img.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap" id="wrap"><img id="img" alt=""></div>
<script src="config/themes.js"></script>
<script src="assets/core.js"></script>
<script>
  // 어느 테마 그림을 쓸지 — 지금 칠해진 색(저장한 테마 · 주소의 테마 · 나만의 색)에 가장 가까운 기본 9색
  function rgb(h) { h = String(h || '').trim().replace('#', ''); if (h.length === 3) h = h.replace(/./g, '$&$&'); return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16) || 0; }); }
  function nearest() {
    var cs = getComputedStyle(document.documentElement), s = rgb(cs.getPropertyValue('--soft')), d = rgb(cs.getPropertyValue('--deep'));
    var best = null, bd = Infinity;
    Object.keys(IDP.THEMES).forEach(function (k) {
      var t = IDP.THEMES[k], a = rgb(t.soft), b = rgb(t.deep);
      var dist = [0, 1, 2].reduce(function (n, i) { return n + Math.pow(a[i] - s[i], 2) + 0.5 * Math.pow(b[i] - d[i], 2); }, 0);
      if (dist < bd) { bd = dist; best = k; }
    });
    return best || 'green';
  }
  var shown = '';
  function draw() {
    var now = IDP.now(), m = IDP.q.get('m') ? Math.max(1, Math.min(12, parseInt(IDP.q.get('m'), 10) || 1)) : now.getMonth() + 1;
    var src = 'covers/' + nearest() + '/month-' + IDP.pad(m) + '.png?v=7';
    if (src === shown) return;
    shown = src;
    var img = document.getElementById('img');
    img.className = '';
    img.onload = function () { img.className = 'on'; };
    img.alt = IDP.MONTHS ? IDP.MONTHS[m - 1] : '';
    img.src = src;
  }
  draw();
  // 달이 바뀌는 자정을 넘겨 켜 둔 화면도 다음 달로 · 테마를 바꾸면 그 색으로
  setInterval(draw, 60 * 1000);
  window.addEventListener('storage', function () { setTimeout(draw, 50); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) draw(); });
</script>
</body>
</html>
