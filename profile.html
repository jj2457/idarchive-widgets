<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Profile</title>
<link rel="stylesheet" href="assets/core.css">
<style>
  [hidden] { display: none !important; }
  .pf { max-width: 360px; margin: 0 auto; }
  .ph { position: relative; width: 100%; aspect-ratio: 1 / 0.82; border-radius: 14px; overflow: hidden; background: var(--tint); }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph .ph0 { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: color-mix(in srgb, var(--deep) 70%, transparent); }
  .today { position: absolute; left: 8px; top: 8px; font-size: 9px; letter-spacing: .16em; padding: 4px 8px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 85%, transparent); color: var(--sub); }
  .nm { margin-top: 12px; font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: .01em; display: flex; align-items: baseline; gap: 6px; }
  .nm small { font-size: 10px; font-weight: 400; color: var(--sub); letter-spacing: .12em; }
  .bio { margin-top: 4px; font-size: 12px; color: var(--sub); line-height: 1.6; }
  .info { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 11.5px; }
  .info dt { color: color-mix(in srgb, var(--deep) 80%, #2a2a2a); font-weight: 600; white-space: nowrap; }
  .info dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  .go { display: block; margin-top: 12px; text-align: center; font-size: 11px; letter-spacing: .08em; padding: 8px; border-radius: 999px; background: var(--tint); color: color-mix(in srgb, var(--deep) 70%, #2a2a2a); text-decoration: none; }
  .empty { margin-top: 10px; font-size: 11px; color: var(--sub); text-align: center; line-height: 1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="grow"><div class="pf">
    <div class="ph"><div class="ph0" id="ph0"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></div><img id="pic" alt="" hidden><span class="today" id="today"></span></div>
    <div class="nm"><span id="name"></span><small id="tag"></small></div>
    <div class="bio" id="bio"></div>
    <dl class="info" id="info"></dl>
    <a class="go" id="go" target="_blank" rel="noopener noreferrer" hidden></a>
    <div class="empty" id="empty" hidden>⚙ 에서 사진 · 닉네임 · 한 줄 소개 · 중요한 정보를 적으면<br>나만의 프로필 창이 돼요.</div>
  </div></div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js"></script>
<script>
  // 나만의 프로필 창(인박스 REQ-093 — 블로그 · 싸이월드의 그 창처럼: 사진 · 닉네임 · 목표 · 중요한 정보).
  // 적은 내용은 위젯 설정(⚙)과 이 위젯 링크에만 — 기록(할 일 · 습관)은 아래 노션 표에서.
  function $(id) { return document.getElementById(id); }
  var W = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  function render() {
    var name = IDP.opt('profile', 'name', ''), bio = IDP.opt('profile', 'bio', ''), tag = IDP.opt('profile', 'tag', '');
    var ph = IDP.listParse(IDP.opt('profile', 'photo', ''), 1)[0], src = ph ? IDP.photo(ph[0]) : '';
    $('pic').hidden = !src; if (src) $('pic').src = src; else $('pic').removeAttribute('src');
    $('ph0').hidden = !!src;
    var d = IDP.now(); $('today').textContent = 'TODAY · ' + (d.getMonth() + 1) + '.' + d.getDate() + ' ' + W[d.getDay()];
    $('name').textContent = name || '닉네임';
    $('tag').textContent = tag;
    $('bio').textContent = bio || '한 줄 소개를 적어 주세요';
    var info = IDP.listParse(IDP.opt('profile', 'info', ''), 2).filter(function (f) { return f[0] || f[1]; }).slice(0, 6);
    var dl = $('info'); dl.innerHTML = ''; dl.hidden = !info.length;
    info.forEach(function (f) { var dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = f[0]; dd.textContent = f[1]; dl.appendChild(dt); dl.appendChild(dd); });
    var link = IDP.listParse(IDP.opt('profile', 'link', ''), 2)[0];
    $('go').hidden = !(link && /^https?:\/\//.test(link[1]));
    if (link && /^https?:\/\//.test(link[1])) { $('go').href = link[1]; $('go').textContent = (link[0] || '바로 가기') + ' →'; }
    $('empty').hidden = !!(name || bio || info.length || src);
  }
  IDP.options('profile', [
    { k: 'name', label: '닉네임', ph: '아카이브' },
    { k: 'tag', label: '작은 글씨(선택)', ph: 'SINCE 2027' },
    { k: 'bio', label: '한 줄 소개 · 올해 목표', ph: '하고 싶은 일로 먹고살기' },
    { k: 'photo', t: 'list', label: '사진', max: 1, fields: [{ label: '사진 — 고르거나 사진 주소(https://…)', url: true, photo: true, ph: 'https://…jpg' }],
      note: '기기에서 고른 사진은 이 기기에서만 보여요. 다른 기기에서도 같은 사진을 보려면 사진 주소를 넣어 주세요.' },
    { k: 'info', t: 'list', label: '중요한 정보 (최대 6줄)', max: 6, fields: [{ label: '항목', ph: '목표' }, { label: '내용', ph: '10km 50분 안에 완주' }] },
    { k: 'link', t: 'list', label: '바로 가기 링크(선택 · 블로그 · 인스타)', max: 1, fields: [{ label: '이름', ph: '블로그' }, { label: '주소', url: true, ph: 'https://…' }] }
  ], render);
  render();
</script>
</body>
</html>
