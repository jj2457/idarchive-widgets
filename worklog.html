<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Weekly Work Log</title>
<link rel="stylesheet" href="assets/core.css">
<style>
  .wrap { max-width: 560px; }
  .goal { margin-top: 12px; }
  .goal input { font-family: 'Playfair Display', serif; font-size: 16px; letter-spacing: .01em; color: var(--ink);
                background: none; border: 0; width: 100%; padding: 0 0 5px; border-bottom: 1px solid var(--line); }
  .goal input:focus { outline: none; border-bottom-color: var(--soft); }
  .stats { margin-top: 12px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat { background: var(--tint); border-radius: 10px; padding: 8px 12px; }
  .stat .k { font-size: 9.5px; letter-spacing: .14em; color: var(--sub); }
  .stat .v { font-size: 19px; color: var(--ink); line-height: 1.3; }
  .stat .v button { padding: 0 6px; font-size: 12px; letter-spacing: 0; background: none; border: 0; color: var(--sub); }
  .list { margin-top: 12px; display: flex; flex-direction: column; gap: 5px; }
  .item { display: flex; align-items: center; gap: 8px; }
  .item .box { flex: none; width: 13px; height: 13px; border-radius: 3px; border: 1px solid var(--line);
               background: var(--paper); cursor: pointer; padding: 0; }
  .item .box.on { background: var(--soft); border-color: var(--soft); }
  .item input { flex: 1; min-width: 0; font: inherit; font-size: 12.5px; color: var(--ink); background: none;
                border: 0; border-bottom: 1px solid transparent; padding: 3px 2px; }
  .item input:focus { outline: none; border-bottom-color: var(--soft); }
  .item.done input { color: var(--sub); text-decoration: line-through; }
  .pair { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pair label { display: block; font-size: 9.5px; letter-spacing: .14em; color: var(--sub); margin-bottom: 3px; }
  .pair textarea { width: 100%; height: 52px; resize: none; font: inherit; font-size: 12px; color: var(--ink);
                   background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .pair textarea:focus { outline: none; border-color: var(--soft); }
  .foot { margin-top: 12px; display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--sub); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="badge" id="badge">WEEKLY WORK LOG</div><span class="caps" id="week"></span></div>
  <div class="grow"><div class="wrap">
    <div class="goal"><input type="text" id="goal" placeholder="이번 주 업무 목표 한 줄"></div>
    <div class="list" id="list"></div>
    <div class="stats">
      <div class="stat"><div class="k">완료율</div><div class="v" id="rate">0%</div></div>
      <div class="stat"><div class="k">미팅</div><div class="v"><button type="button" id="minus">–</button><span id="meet">0</span><button type="button" id="plus">+</button></div></div>
    </div>
    <div class="pair">
      <div><label>다음 주 할 일</label><textarea id="next" placeholder="다음 주로 넘기는 것"></textarea></div>
      <div><label>주간 회고</label><textarea id="review" placeholder="이번 주에 배운 것"></textarea></div>
    </div>
  </div></div>
  <div class="foot"><span>주가 바뀌면 새 칸으로 시작합니다</span><span>이 기기에 저장돼요</span></div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js"></script>
<script>
  // The WORK module's weekly log, for a dashboard. The planner's own WEEKS table stays the record —
  // this is the card kept open while the week is running.
  var ROWS = 5, KEY = '', WEEK = '';
  function weekKey() {
    var d = IDP.now();
    var day = d.getDay();
    var shift = IDP.weekStart === 'sun' ? day : (day + 6) % 7;
    var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - shift);
    var first = new Date(mon.getFullYear(), 0, 1);
    var n = Math.floor((mon - first) / 6048e5) + 1;
    return { key: mon.getFullYear() + '-W' + IDP.pad(n), label: 'W' + IDP.pad(n) };
  }
  function readOpts() {
    var w = weekKey();
    WEEK = w.label;
    KEY = 'idarchive.worklog.' + (IDP.q.get('id') || IDP.opt('worklog', 'title', 'main')) + '.' + w.key;
  }
  readOpts();
  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (v) return v;
    } catch (e) { /* storage blocked */ }
    var d = IDP.seed(), done = IDP.seedDone();
    var t = { goal: d[0] || '', items: d.slice(1, 1 + ROWS), done: {}, meet: +(IDP.q.get('meet') || 0) || 0,
              next: IDP.q.get('next') || '', review: IDP.q.get('review') || '' };
    done.forEach(function (i) { t.done[i] = 1; });
    return t;
  }
  var st = load();
  if (!st.items) st.items = [];
  if (!st.done) st.done = {};
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  // the rate counts only the rows that actually have something written in them
  function rate() {
    var filled = st.items.filter(function (v) { return (v || '').trim(); }).length;
    if (!filled) return 0;
    var done = st.items.filter(function (v, i) { return (v || '').trim() && st.done[i]; }).length;
    return Math.round(done / filled * 100);
  }
  function paint() {
    document.getElementById('rate').textContent = rate() + '%';
    document.getElementById('meet').textContent = st.meet;
    document.getElementById('week').textContent = WEEK;
  }
  function render() {
    document.getElementById('badge').textContent = IDP.opt('worklog', 'label', 'WEEKLY WORK LOG');
    var g = document.getElementById('goal');
    if (document.activeElement !== g) g.value = st.goal || '';
    var box = document.getElementById('list');
    box.innerHTML = '';
    for (var i = 0; i < ROWS; i++) (function (i) {
      var row = document.createElement('div');
      row.className = 'item' + (st.done[i] ? ' done' : '');
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'box' + (st.done[i] ? ' on' : '');
      b.setAttribute('aria-label', (i + 1) + '번째 업무 완료');
      b.onclick = function () {
        if (st.done[i]) delete st.done[i]; else st.done[i] = 1;
        row.className = 'item' + (st.done[i] ? ' done' : '');
        b.className = 'box' + (st.done[i] ? ' on' : '');
        save(); paint();
      };
      var inp = document.createElement('input');
      inp.type = 'text'; inp.placeholder = i ? '' : '이번 주 주요 업무';
      inp.value = st.items[i] || '';
      inp.oninput = function () { st.items[i] = inp.value; save(); paint(); };
      row.appendChild(b); row.appendChild(inp);
      box.appendChild(row);
    })(i);
    document.getElementById('next').value = st.next || '';
    document.getElementById('review').value = st.review || '';
    paint();
  }
  document.getElementById('goal').oninput = function () { st.goal = this.value; save(); };
  document.getElementById('next').oninput = function () { st.next = this.value; save(); };
  document.getElementById('review').oninput = function () { st.review = this.value; save(); };
  document.getElementById('plus').onclick = function () { st.meet++; save(); paint(); };
  document.getElementById('minus').onclick = function () { st.meet = Math.max(0, st.meet - 1); save(); paint(); };

  IDP.options('worklog', [
    { k: 'label', label: '제목', ph: 'WEEKLY WORK LOG' },
    { k: 'title', label: '이 위젯의 이름 (여러 개 쓸 때)', ph: 'main' }
  ], function () { readOpts(); st = load(); if (!st.items) st.items = []; if (!st.done) st.done = {}; render(); });
  render();
</script>
</body>
</html>
