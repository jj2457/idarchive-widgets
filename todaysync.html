<style>

<div class="card" id="card">
  <div class="grow"><div class="wrap">
    <div class="head"><h2 id="title">TODAY</h2><span class="hr"><span class="d" id="date"></span><button type="button" class="plus" id="plus" aria-label="할 일이나 메모 적기" hidden>+</button></span></div>
    <form class="add" id="add" autocomplete="off" hidden><span class="seg" id="seg"><button type="button" data-k="todo" class="on">할 일</button><button type="button" data-k="note">메모</button></span><input id="text" maxlength="200" placeholder="오늘 할 일 한 줄" aria-label="적을 내용"><button type="submit" class="go" id="go">적기</button></form>
    <div class="grid" id="grid"></div>
    <div class="gate" id="gate" hidden></div>
    <div class="foot" id="foot"><span class="state" id="state"></span><button type="button" id="again">새로 읽기</button></div>
  </div></div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js?v=r6c"></script>

<script>
  // 오늘 한눈에(노션) — 다른 곳에서 적은 것을 다시 적지 않고 모아 본다: 할 일(TASKS) · 습관(HABITS · DAYS) · 이번 달 지출(LEDGER · BUDGET) · 정리 전 메모(NOTES).
  // 읽기만 한다. 원본은 노션 표 — 위젯은 아무것도 저장하지 않는다. 표가 없는 칸(옛 복제본)은 그 칸만 「없음」, 연결 문제만 전체를 막는다. ?demo=1 은 견본.
  var S = IDP.sync;
  var DEMO = IDP.q.get('demo') === '1';
  var W = ['일', '월', '화', '수', '목', '금', '토'], seq = 0, cards = null;
  function $(id) { return document.getElementById(id); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function won(n) { return '₩' + Math.round(n || 0).toLocaleString('ko-KR'); }
  if (S.popup()) throw new Error('popup');
  S.onConnect(function () { load(); });
  function state(t) { $('state').textContent = t || ''; }
  function gate(html, btn) {
    $('gate').hidden = false; $('grid').hidden = true; $('foot').hidden = true; $('plus').hidden = true; $('add').hidden = true;
    $('gate').innerHTML = html + (btn ? '<br><button type="button" id="cn">' + btn + '</button>' : '');
    if (btn) $('cn').onclick = function () { S.connect(); };
  }
  // 칸 하나 = { k, v, unit, s, pct, quiet, over }
  function todoCard(d, late) {
    if (d === FAIL) return failCard('할 일');
    if (!d) return { k: '할 일', v: '—', quiet: true, s: '할 일 목록을 찾지 못했어요' };
    var all = (d.items || []), left = all.filter(function (x) { return !x.done; });
    var lt = late && late !== FAIL && late.count ? late : null;   // 밀린 일(지난 60일 · 끝내지 않은 할 일)
    if (!all.length) return { k: '할 일', v: '아직 없어요', quiet: true, s: '눌러서 오늘 할 일 한 줄', archie: true, go: 'todo', late: lt };
    var first = left.filter(function (x) { return x.important; })[0] || left[0];
    return { k: '할 일', v: left.length ? String(left.length) : '다 했어요', unit: left.length ? '개 남음' : '', s: first ? first.title : all.length + '개 모두 끝냈어요', pct: (all.length - left.length) / all.length, archie: left.length ? null : 'done',
      act: first ? { kind: 'todo', id: first.id, title: first.title, label: '「' + first.title + '」 끝냄' } : null, late: lt };
  }
  function habitCard(d) {
    if (d === FAIL) return failCard('습관');
    if (!d) return { k: '습관', v: '—', quiet: true, s: '습관 목록을 찾지 못했어요' };
    var hs = d.habits || [], done = hs.filter(function (h) { return h.done; }).length;
    if (!hs.length) return { k: '습관', v: '아직 없어요', quiet: true, s: 'HABIT 에서 습관을 하나 만들어 보세요' };
    var next = hs.filter(function (h) { return !h.done; })[0];
    var nm = next ? (next.name || next.title || '') : '';
    return { k: '습관', v: done + ' / ' + hs.length, s: next ? '다음 · ' + nm : '오늘 다 지켰어요', pct: done / hs.length,
      act: next ? { kind: 'habit', id: next.id, title: nm, label: '「' + nm + '」 오늘 체크' } : null };
  }
  function moneyCard(d) {
    if (d === FAIL) return failCard('이번 달 지출');
    if (!d) return { k: '이번 달 지출', v: '—', quiet: true, s: '가계부를 찾지 못했어요' };
    if (!d.count) return { k: '이번 달 지출', v: won(0), quiet: true, s: '이번 달에 적은 지출이 아직 없어요' };
    var c = { k: '이번 달 지출', v: won(d.expense), s: d.budget ? '예산의 ' + Math.round((d.used || 0) * 100) + '%' : (d.income ? '수입 ' + won(d.income) : d.count + '건') };
    if (d.budget) { c.pct = Math.min(1, d.used || 0); c.over = (d.used || 0) > 1; }
    return c;
  }
  function noteCard(d) {
    if (d === FAIL) return failCard('메모');
    if (!d) return { k: '메모', v: '—', quiet: true, s: '메모 목록을 찾지 못했어요' };
    var n = (d.items || []).length;
    if (!n) return { k: '메모', v: '0', unit: '개', quiet: true, s: '눌러서 떠오른 생각 한 줄', go: 'note' };
    var m = d.items.filter(function (x) { return (x.text || '').trim(); })[0];   // 맨 위 메모가 비어 있으면 글이 있는 다음 메모
    // 메모 → 할 일(2026-10-02 · 다시 적지 않기) — 글이 있는 메모 한 건에 「할 일로」. 글은 줄 안에 보이므로 아래 작은 줄(s)은 비운다
    if (m) return { k: '메모', v: n >= 30 ? '30+' : String(n), unit: '개 정리 전', s: '', memo: { id: m.id, text: m.text.trim() } };
    return { k: '메모', v: n >= 30 ? '30+' : String(n), unit: '개 정리 전', s: '내용이 빈 메모예요' };   // 서버는 최근 30개까지 돌려준다
  }
  function render() {
    $('title').textContent = IDP.opt('todaysync', 'label', '') || 'TODAY';
    var t = IDP.now();
    $('date').textContent = t.getFullYear() + '. ' + pad(t.getMonth() + 1) + '. ' + pad(t.getDate()) + ' ' + W[t.getDay()];
    $('gate').hidden = true; $('grid').hidden = false; $('foot').hidden = false; $('plus').hidden = false;
    var G = $('grid'); G.innerHTML = '';
    (cards || []).forEach(function (c) {
      var e = document.createElement('div'); e.className = 'c' + (c.quiet ? ' quiet' : '') + (c.over ? ' over' : '') + (c.wait ? ' wait' : '') + (c.soft ? ' soft' : '');
      var k = document.createElement('div'); k.className = 'k'; k.textContent = c.k;
      var v = document.createElement('div'); v.className = 'v'; v.textContent = c.v;
      if (c.archie) v.insertAdjacentHTML('afterbegin', c.archie === 'done' ? ARCHIE_DONE : ARCHIE);   // 브랜드 캐릭터 아키(REQ-045) — 빈 칸 · 다 끝낸 순간에만, 작게
      if (c.go) { e.className += ' go'; e.onclick = function () { openAdd(c.go); }; }
      if (c.act) { var tb = document.createElement('button'); tb.type = 'button'; tb.className = 'tick'; tb.setAttribute('aria-label', c.act.label); tb.title = c.act.label; tb.innerHTML = TICK; tb.onclick = (function (a, b) { return function () { b.disabled = true; doAct(a, true); }; })(c.act, tb); e.appendChild(tb); }
      if (c.unit) { var u = document.createElement('small'); u.textContent = c.unit; v.appendChild(u); }
      var s = document.createElement('div'); s.className = 's'; s.textContent = c.s || '';
      e.appendChild(k); e.appendChild(v); e.appendChild(s);
      if (c.late) {
        var it = c.late.items[0], ln = document.createElement('div'); ln.className = 'late';
        var tx = document.createElement('span'); tx.textContent = '밀린 일 ' + c.late.count + ' · ' + it.title; ln.appendChild(tx);
        var mv = document.createElement('button'); mv.type = 'button'; mv.textContent = '오늘로'; mv.setAttribute('aria-label', '「' + it.title + '」 오늘로 옮기기');
        mv.onclick = (function (x, b) { return function (ev) { ev.stopPropagation(); b.disabled = true; doMove(x, true); }; })(it, mv);
        ln.appendChild(mv); e.appendChild(ln);
      }
      if (c.memo) {
        var mm = c.memo, ml = document.createElement('div'); ml.className = 'late';
        var mt = document.createElement('span'); mt.textContent = mm.text; ml.appendChild(mt);
        var mb = document.createElement('button'); mb.type = 'button'; mb.textContent = '할 일로'; mb.setAttribute('aria-label', '「' + mm.text + '」 오늘 할 일로 옮기기');
        mb.onclick = (function (x, b) { return function (ev) { ev.stopPropagation(); b.disabled = true; doMemo(x, true); }; })(mm, mb);
        ml.appendChild(mb); e.appendChild(ml);
      }
      if (c.pct != null) { var b = document.createElement('div'); b.className = 'bar'; b.innerHTML = '<i></i>'; b.firstChild.style.width = Math.round(c.pct * 100) + '%'; e.appendChild(b); }
      G.appendChild(e);
    });
  }
  // 칸마다 따로 읽는다 — 표가 없는 칸은 null(그 칸만 「없음」). 연결 · 플래너 선택 문제는 위로 던져 전체 안내
  var HARD = { not_connected: 1, notion_revoked: 1, choose_planner: 1, no_planner: 1, protected_planner: 1 };
  // 표가 없는 옛 복제본(no_table · not_shared) = null(그 칸만 「—」), 잠깐의 오류(노션 지연 · 인터넷) = FAIL(그 칸만 「잠시 뒤 다시」) — 둘을 섞지 않는다
  var FAIL = {};
  var ARCHIE = IDP.archie('empty');
  var ARCHIE_DONE = IDP.archie('done');   // 해냈어요 — 웃는 눈 · 입
  var TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5 l3 3 l6 -7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // 방금 내가 바꾼 것 — 노션이 몇 초 늦게 읽혀도 20초 동안은 내 저장을 믿는다(HABIT 위젯과 같은 규칙)
  var wrote = {}, raw = null;
  function mine(list) {
    (list || []).forEach(function (x) { var w = wrote[x.id]; if (w && w.until > Date.now()) x.done = w.done; });
    return list;
  }
  function build(r) {
    if (r[0] && r[0] !== FAIL) mine(r[0].items);
    if (r[1] && r[1] !== FAIL) mine(r[1].habits);
    cards = [todoCard(r[0], r[4]), habitCard(r[1]), moneyCard(r[2]), noteCard(r[3])];
  }
  // 바로 하기 — 할 일은 노션 TASKS 「완료」, 습관은 오늘 DAYS 「완료한 습관」. 되돌리기는 같은 길로 반대로
  var acting = false;   // 노션에 적는 동안 다른 ✓ · 오늘로 · 되돌리기는 받지 않는다(느린 연결에서 두 번 눌러 다른 줄이 바뀌는 일 막기)
  function doAct(a, done) {
    if (acting && !DEMO) return;
    var label = a.kind === 'todo' ? (done ? '끝냈어요' : '다시 할 일로 돌렸어요') : (done ? '오늘 체크했어요' : '체크를 풀었어요');
    function after() {
      wrote[a.id] = { done: done, until: Date.now() + 20000 };
      if (raw) build(raw);
      render();
      var st = $('state'); st.textContent = '「' + a.title + '」 ' + label;
      if (done) { var u = document.createElement('button'); u.type = 'button'; u.className = 'undo'; u.textContent = '되돌리기'; u.onclick = function () { u.disabled = true; doAct(a, false); }; st.appendChild(u); }
    }
    if (DEMO) { (a.kind === 'todo' ? raw[0].items : raw[1].habits).forEach(function (x) { if (x.id === a.id) x.done = done; }); return after(); }
    state('노션에 적는 중…'); acting = true;
    var p = a.kind === 'todo' ? S.api('PATCH', '/v1/todo/' + a.id, { done: done }) : S.api('POST', '/v1/habits/check', { habit: a.id, date: iso(IDP.now()), done: done });
    p.then(function () { acting = false; after(); setTimeout(function () { load(true); }, 4000); })
      .catch(function (e) { acting = false; render(); state(e.code === 'no_day' ? '오늘 기록 페이지(DAYS)가 없어요.' : (e.message || '노션에 적지 못했어요 — 다시 눌러 주세요')); });
  }
  // 밀린 일 「오늘로」 — 노션 TASKS 의 날짜만 오늘로(시간이 있으면 시간은 그대로). 되돌리기 = 원래 날짜로
  function doMove(it, toToday) {
    if (acting && !DEMO) return;
    var today = iso(IDP.now()), to = toToday ? today : it.date, from = toToday ? it.date : today;
    function after() {
      var st = $('state'); st.textContent = '「' + it.title + '」 ' + (toToday ? '오늘로 옮겼어요' : '원래 날짜로 돌렸어요');
      if (toToday) { var u = document.createElement('button'); u.type = 'button'; u.className = 'undo'; u.textContent = '되돌리기'; u.onclick = function () { u.disabled = true; doMove(it, false); }; st.appendChild(u); }
    }
    if (DEMO) {
      if (toToday) { raw[4].items = raw[4].items.filter(function (x) { return x.id !== it.id; }); raw[4].count--; raw[0].items.push({ id: it.id, title: it.title, done: false }); }
      else { raw[0].items = raw[0].items.filter(function (x) { return x.id !== it.id; }); raw[4].items.unshift(it); raw[4].count++; }
      build(raw); render(); return after();
    }
    state('노션에 적는 중…'); acting = true;
    S.api('PATCH', '/v1/todo/' + it.id, { date: to, from: from })
      .then(function () { acting = false; return load(true); }).then(after)
      .catch(function (e) { acting = false; render(); state(e.message || '노션에 적지 못했어요 — 다시 눌러 주세요'); });
  }
  // 메모 → 오늘 할 일: TASKS 에 새 할 일(오늘 · 메모 글 그대로) → 그 메모는 「정리함」. 되돌리기 = 새 할 일 휴지통 + 메모 다시 정리 전.
  // 할 일은 생겼는데 메모 정리가 실패하면 둘 다 남겨 두고 알린다(지우지 않는다 — 다시 적을 일이 없게)
  function doMemo(mm, forward) {
    if (acting && !DEMO) return;
    function after() {
      var st = $('state'); st.textContent = '「' + mm.text.slice(0, 20) + (mm.text.length > 20 ? '…' : '') + '」 ' + (forward ? '오늘 할 일로 옮겼어요' : '메모로 돌렸어요');
      if (forward) { var u = document.createElement('button'); u.type = 'button'; u.className = 'undo'; u.textContent = '되돌리기'; u.onclick = function () { u.disabled = true; doMemo(mm, false); }; st.appendChild(u); }
    }
    if (DEMO) {
      if (forward) { mm.task = 'm' + Date.now(); raw[3].items = raw[3].items.filter(function (x) { return x.id !== mm.id; }); raw[0].items.push({ id: mm.task, title: mm.text, done: false }); }
      else { raw[0].items = raw[0].items.filter(function (x) { return x.id !== mm.task; }); raw[3].items.unshift({ id: mm.id, text: mm.text }); }
      build(raw); render(); return after();
    }
    state('노션에 적는 중…'); acting = true;
    var p = forward
      ? S.api('POST', '/v1/todo', { title: mm.text.slice(0, 200), date: iso(IDP.now()) }).then(function (t) {
          mm.task = t.id;
          return S.api('PATCH', '/v1/notes/' + mm.id, { done: true }).catch(function (e) { e.half = true; throw e; });
        })
      : S.api('DELETE', '/v1/todo/' + mm.task).then(function () { return S.api('PATCH', '/v1/notes/' + mm.id, { done: false }); });
    p.then(function () { acting = false; return load(true); }).then(after)
      .catch(function (e) {
        acting = false;
        if (e.half) { load(true); return state('할 일은 만들었어요 — 메모 정리는 노션에서 한 번 더 해 주세요'); }
        render(); state(e.message || '노션에 적지 못했어요 — 다시 눌러 주세요');
      });
  }
  function soft(p) { return p.catch(function (e) { if (HARD[e.code]) throw e; return (e.code === 'no_table' || e.code === 'not_shared' || e.code === 'no_habits') ? null : FAIL; }); }
  function failCard(k) { return { k: k, v: '잠시 뒤 다시', soft: true, quiet: true, s: '노션이 잠깐 응답하지 않았어요 — 「새로 읽기」' }; }
  function waitCards() { return ['할 일', '습관', '이번 달 지출', '메모'].map(function (k) { return { k: k, v: '…', wait: true, s: '' }; }); }
  function load(quiet) {   // quiet = 바로 하기 뒤 조용히 다시 읽기(아래 줄 「되돌리기」를 지우지 않는다)
    var t = IDP.now(), day = iso(t), month = day.slice(0, 7), tz = t.getTimezoneOffset();
    if (DEMO) {
      raw = raw || [{ items: [{ id: 't1', title: '기획안 초안 보내기', done: false, important: true }, { id: 't2', title: '운동 30분', done: true }, { id: 't3', title: '장보기', done: false }, { id: 't4', title: '책 20쪽', done: true }, { id: 't5', title: '메일 정리', done: true }] },
        { habits: [{ id: 'h1', name: '운동', done: true }, { id: 'h2', name: '물 마시기', done: true }, { id: 'h3', name: '책 읽기', done: false }, { id: 'h4', name: '일기 쓰기', done: false }] },
        { count: 23, expense: 412300, income: 0, budget: 800000, used: 0.515 },
        { items: [{ id: 'n1', text: '다음 달 여행 숙소 후보 3곳 비교' }, { id: 'n2', text: '세탁소 맡긴 코트 찾기' }, { id: 'n3', text: '블로그 글감 — 아침 루틴' }] },
        { count: 1, items: [{ id: 'o1', title: '세금 고지서 확인', date: iso(new Date(IDP.now().getTime() - 2 * 864e5)) }] }];
      build(raw); render(); state('견본 · 노션과 연결하면 내 플래너의 오늘이 보여요'); return;
    }
    if (!S.base) return gate('노션 연결 준비 중이에요.');
    if (!S.wid()) return gate('노션에 적어 둔 할 일 · 습관 · 가계부 · 메모를<br>다시 적지 않고 여기서 한 번에 봐요.', '노션과 연결하기');
    var my = ++seq;
    if (!cards) { cards = waitCards(); render(); }   // 처음엔 빈 칸 모양 — 「없어요」를 먼저 보여 주지 않는다
    if (!quiet) state('불러오는 중…');
    return Promise.all([
      soft(S.api('GET', '/v1/todo?date=' + day + '&tz=' + tz)),
      soft(S.api('GET', '/v1/habits?date=' + day)),
      soft(S.api('GET', '/v1/finance?month=' + month + '&tz=' + tz)),
      soft(S.api('GET', '/v1/notes?show=open')),
      soft(S.api('GET', '/v1/todo/overdue?date=' + day + '&tz=' + tz)).catch(function () { return null; })
    ]).then(function (r) {
      if (my !== seq) return;
      raw = r; build(r);
      var d = new Date(); if (!quiet) state('노션에서 읽음 ' + pad(d.getHours()) + ':' + pad(d.getMinutes())); render();
    }).catch(function (e) {
      if (my !== seq) return;
      state('');
      if (e.code === 'not_connected' || e.code === 'notion_revoked') return gate('노션 연결이 끊겼어요.', '다시 연결하기');
      if (e.code === 'choose_planner') { gate('연결된 플래너가 여러 개예요. 이 위젯이 쓸 플래너를 골라 주세요.'); return S.choosePlanner($('gate'), load); }
      if (e.code === 'no_planner') return gate('플래너 페이지를 노션 연결 목록에 넣어 주세요.', '다시 연결하기');
      if (e.code === 'protected_planner') return gate('이 플래너는 읽을 수 없어요.');
      state(e.message);
    });
  }
  $('again').onclick = function () { load(); };
  // 바로 적기(2026-10-02) — 할 일은 노션 TASKS(오늘 날짜), 메모는 NOTES(머릿속 비우기)로. 적으면 DAILY · 달력 · 머릿속 비우기에도 그대로 보인다
  var kind = 'todo', busy = false;
  function openAdd(k) {   // 빈 칸을 누르면 그 종류로 바로 적기
    $('add').hidden = false;
    Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function (x) { if (x.getAttribute('data-k') === k) x.click(); });
    $('text').focus();
  }
  $('plus').onclick = function () { var f = $('add'); f.hidden = !f.hidden; if (!f.hidden) $('text').focus(); };
  Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function (b) {
    b.onclick = function () { kind = b.getAttribute('data-k'); Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function (x) { x.className = x === b ? 'on' : ''; }); $('text').placeholder = kind === 'todo' ? '오늘 할 일 한 줄' : '떠오른 생각 한 줄'; $('text').focus(); };
  });
  $('add').onsubmit = function (ev) {
    ev.preventDefault();
    var t = $('text').value.replace(/\s+/g, ' ').trim();
    if (!t || busy) return;
    if (DEMO) { if (kind === 'todo') raw[0].items.unshift({ id: 't' + Date.now(), title: t, done: false, important: true }); else raw[3].items.unshift({ id: 'n' + Date.now(), text: t }); $('text').value = ''; build(raw); render(); state(kind === 'todo' ? '견본 · 할 일에 더했어요' : '견본 · 메모에 더했어요'); return; }
    busy = true; $('go').disabled = true; state('노션에 적는 중…');
    var p = kind === 'todo' ? S.api('POST', '/v1/todo', { title: t, date: iso(IDP.now()) }) : S.api('POST', '/v1/notes', { text: t });
    p.then(function () { $('text').value = ''; state(kind === 'todo' ? '오늘 할 일에 넣었어요' : '머릿속 비우기에 넣었어요'); setTimeout(load, 1200); })
      .catch(function (e) { state(e.message || '노션에 저장하지 못했어요 — 글은 그대로 두었어요'); })
      .then(function () { busy = false; $('go').disabled = false; });
  };
  // 노션에서 적고 돌아오면 다시 읽는다
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !DEMO && S.wid() && S.base) load(); });
  IDP.options('todaysync', [{ k: 'label', label: '제목', ph: 'TODAY' }], function () { render(); });
  load();
</script>
</body>
</html>
