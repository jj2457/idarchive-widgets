<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Progress (Notion)</title>
<link rel="stylesheet" href="assets/core.css">
<style>
  .wrap { max-width: 520px; margin: 0 auto; }
  [hidden] { display: none !important; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 4px; gap: 8px; }
  .head h2 { margin: 0; font-size: 22px; letter-spacing: .02em; color: color-mix(in srgb, var(--deep) 75%, #2a2a2a); font-weight: 700; }
  .pill { font-size: 10.5px; padding: 3px 10px; border-radius: 999px; background: var(--tint); color: color-mix(in srgb, var(--deep) 70%, #2a2a2a); white-space: nowrap; }
  .tabs { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
  .kinds { display: flex; gap: 10px; margin-top: 2px; }
  .kinds button { padding: 0; border: 0; background: none; font-size: 11px; letter-spacing: .04em; text-transform: none; color: var(--sub); }
  .kinds button.on { color: color-mix(in srgb, var(--deep) 80%, #2a2a2a); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .tabs button { padding: 4px 10px; border-radius: 999px; font-size: 11px; letter-spacing: .02em; text-transform: none; border: 1px solid color-mix(in srgb, var(--deep) 25%, transparent); background: var(--paper); color: var(--sub); }
  .tabs button.on { background: var(--deep); border-color: var(--deep); color: #fff; }
  .list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 60px; }
  .g { display: block; padding: 9px 10px; border-radius: 10px; text-decoration: none; color: inherit; }
  .g:hover { background: var(--tint); }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .t { flex: 1; min-width: 0; font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p { flex: none; font-size: 12px; font-weight: 600; color: color-mix(in srgb, var(--deep) 80%, #2a2a2a); }
  .g.done .t { color: var(--sub); text-decoration: line-through; }
  .bar { margin-top: 6px; height: 5px; border-radius: 999px; background: var(--tint); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--deep); border-radius: 999px; transition: width .25s; }
  .meta { margin-top: 4px; font-size: 9.5px; color: var(--sub); letter-spacing: .02em; }
  .pg { flex: none; padding: 1px 8px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--deep) 30%, transparent); background: var(--paper); font-size: 10px; letter-spacing: 0; text-transform: none; color: color-mix(in srgb, var(--deep) 80%, #2a2a2a); }
  .pgform { display: flex; align-items: center; gap: 6px; margin: -2px 10px 4px; font-size: 11px; color: var(--sub); }
  .pgform input { width: 76px; padding: 5px 8px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--deep) 30%, transparent); font: inherit; font-size: 12px; color: var(--ink); background: var(--paper); }
  .pgform button { padding: 5px 12px; border-radius: 999px; border: 0; background: var(--deep); color: #fff; font-size: 11px; text-transform: none; letter-spacing: 0; }
  .gate { margin-top: 16px; text-align: center; font-size: 11.5px; color: var(--sub); line-height: 1.8; }
  .gate button { margin-top: 10px; padding: 9px 18px; border-radius: 999px; background: var(--deep); color: #fff; border: 0; font-size: 12px; letter-spacing: .04em; text-transform: none; }
  .state { font-size: 9.5px; color: var(--sub); text-align: center; margin-top: 8px; letter-spacing: .04em; min-height: 12px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="grow"><div class="wrap">
    <div class="kinds" id="kinds"></div>
    <div class="head"><h2 id="title">GOALS</h2><span class="pill" id="sum"></span></div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
    <div class="gate" id="gate" hidden></div>
    <div class="state" id="state"></div>
  </div></div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js"></script>
<script src="assets/sync.js"></script>
<script>
  // 노션 GOALS · PROJECTS · BOOKS 와 이어지는 진행률 위젯 — 보기만 한다. 진행률은 노션 수식이 계산한 값 그대로.
  // 목표를 누르면 노션의 그 목표 페이지가 열린다. ?demo=1 은 견본(연결 없음).
  var S = IDP.sync;
  var DEMO = IDP.q.get('demo') === '1';
  // 목표 · 프로젝트 · 책 — 연결 서버 /v1/progress?kind=. 심을 때 ?kind=books 처럼 정할 수 있고, 위젯 안 글자로도 바꾼다
  var KINDS = {
    goals: { name: '목표', head: 'GOALS', tabs: [['all', '전체'], ['year', '올해'], ['month', '이번 달'], ['week', '이번 주']], done: '완료', none: '아직 목표가 없어요. 노션 GOALS 에서 목표를 더해 주세요.', noneTab: '이 기간의 목표가 없어요. 노션 GOALS 의 「기간」을 정하면 여기 모여요.', hint: '진행률은 연결한 할 일 · 프로젝트 · 습관에서 계산돼요' },
    projects: { name: '프로젝트', head: 'PROJECTS', tabs: [['active', '진행 · 예정'], ['doing', '진행 중'], ['done', '완료'], ['all', '전체']], done: '완료', none: '아직 프로젝트가 없어요. 노션 PROJECTS 에서 더해 주세요.', noneTab: '이 상태의 프로젝트가 없어요.', hint: '진행률은 프로젝트에 연결한 할 일에서 계산돼요' },
    books: { name: '책', head: 'READING', tabs: [['reading', '읽는 중'], ['want', '읽고 싶은'], ['done', '다 읽음'], ['all', '전체']], done: '다 읽음', none: '아직 책이 없어요. 노션 BOOKS 에서 책을 더해 주세요.', noneTab: '이 상태의 책이 없어요.', hint: '현재 쪽을 적으면 진도율이 올라가요' }
  };
  var KKEY = 'idarchive.progresssync.kind';
  var kind = IDP.q.get('kind') || (function () { try { return localStorage.getItem(KKEY) || 'goals'; } catch (e) { return 'goals'; } })();
  if (!KINDS[kind]) kind = 'goals';
  var KEY = 'idarchive.progresssync.filter.';
  function savedFilter(k) { try { return localStorage.getItem(KEY + k) || KINDS[k].tabs[0][0]; } catch (e) { return KINDS[k].tabs[0][0]; } }
  var period = savedFilter(kind);
  var goals = [], seq = 0;
  function $(id) { return document.getElementById(id); }
  if (S.popup()) throw new Error('popup');
  S.onConnect(function () { load(); });
  function state(t) { $('state').textContent = t || ''; }
  function gate(html, btn) {
    $('gate').hidden = false; $('list').innerHTML = ''; $('sum').textContent = '';
    $('gate').innerHTML = html + (btn ? '<br><button type="button" id="go">' + btn + '</button>' : '');
    if (btn) $('go').onclick = function () { S.connect(); };
  }
  function pct(p) { return p == null ? '—' : Math.round(p * 100) + '%'; }
  function drawTabs() {
    var K = $('kinds'); K.innerHTML = '';
    if (!IDP.q.get('kind')) Object.keys(KINDS).forEach(function (k) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = KINDS[k].name; if (k === kind) b.className = 'on';
      b.onclick = function () { kind = k; period = savedFilter(k); try { localStorage.setItem(KKEY, k); } catch (e) {} goals = []; drawTabs(); load(); };
      K.appendChild(b);
    });
    var T = $('tabs'); T.innerHTML = '';
    KINDS[kind].tabs.forEach(function (x) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = x[1]; if (x[0] === period) b.className = 'on';
      b.onclick = function () { period = x[0]; try { localStorage.setItem(KEY + kind, period); } catch (e) {} goals = []; drawTabs(); load(); };
      T.appendChild(b);
    });
  }
  function render() {
    $('title').textContent = IDP.opt('goalsync', 'label', '') || KINDS[kind].head;
    var withP = goals.filter(function (g) { return g.progress != null; });
    var avg = withP.length ? withP.reduce(function (a, g) { return a + g.progress; }, 0) / withP.length : null;
    $('sum').textContent = !goals.length ? '' : (avg == null ? '' : '평균 ' + pct(avg) + ' · ') + goals.length + '개';
    var L = $('list'); L.innerHTML = '';
    goals.forEach(function (g) {
      var a = document.createElement('a'); a.className = 'g' + (g.status === KINDS[kind].done ? ' done' : '');
      if (g.url) { a.href = g.url; a.target = '_blank'; a.rel = 'noopener'; }
      var row = document.createElement('div'); row.className = 'row';
      var t = document.createElement('span'); t.className = 't'; t.textContent = g.title;
      var p = document.createElement('span'); p.className = 'p'; p.textContent = pct(g.progress);
      row.appendChild(t); row.appendChild(p);
      var bar = document.createElement('div'); bar.className = 'bar'; var i = document.createElement('i'); i.style.width = g.progress == null ? '0' : Math.round(g.progress * 100) + '%'; bar.appendChild(i);
      var m = document.createElement('div'); m.className = 'meta';
      m.textContent = [g.period, g.area, g.type, g.status, g.page != null && g.pages ? g.page + ' / ' + g.pages + '쪽' : '', g.due ? '마감 ' + g.due.slice(5).replace('-', '/') : ''].filter(Boolean).join(' · ') || KINDS[kind].hint;
      a.appendChild(row); a.appendChild(bar); a.appendChild(m);
      L.appendChild(a);
      // 책: 읽은 쪽을 여기서 바로 적기 — 노션 「현재 쪽」에 저장되고 진도율은 노션 수식이 다시 계산한다
      if (kind === 'books' && g.status !== KINDS.books.done) {
        var pb = document.createElement('button'); pb.type = 'button'; pb.className = 'pg'; pb.textContent = '쪽';
        pb.setAttribute('aria-label', g.title + ' 읽은 쪽 적기');
        pb.onclick = function (ev) { ev.preventDefault(); ev.stopPropagation(); pageForm(a, g); };
        row.appendChild(pb);
      }
    });
    if (!goals.length) L.innerHTML = '<div class="gate">' + (period === 'all' ? KINDS[kind].none : KINDS[kind].noneTab) + '</div>';
  }
  function pageForm(a, g) {
    if (a.nextSibling && a.nextSibling.className === 'pgform') { a.parentNode.removeChild(a.nextSibling); return; }
    var f = document.createElement('form'); f.className = 'pgform';
    var inp = document.createElement('input'); inp.type = 'number'; inp.min = '0'; inp.inputMode = 'numeric'; inp.placeholder = '지금 쪽';
    if (g.page != null) inp.value = g.page;
    var of = document.createElement('span'); of.textContent = g.pages ? '/ ' + g.pages + '쪽' : '쪽';
    var b = document.createElement('button'); b.type = 'submit'; b.textContent = '저장';
    f.appendChild(inp); f.appendChild(of); f.appendChild(b);
    f.onsubmit = function (ev) {
      ev.preventDefault();
      var n = Number(inp.value);
      if (!Number.isInteger(n) || n < 0) { state('쪽은 0 이상의 숫자로 적어 주세요'); return; }
      if (g.pages && n > g.pages) n = g.pages;
      b.disabled = true;
      var done = function (item) { Object.assign(g, item); state(''); render(); };
      if (DEMO) return done({ page: n, progress: g.pages ? n / g.pages : g.progress });
      state('노션에 적는 중…');
      S.api('PATCH', '/v1/progress/books/' + g.id, { page: n }).then(done).catch(function (e) { b.disabled = false; state(e.message || '노션에 저장하지 못했어요'); });
    };
    a.parentNode.insertBefore(f, a.nextSibling);
    inp.focus();
  }
  function load() {
    $('gate').hidden = true; drawTabs();
    if (DEMO) { var S0 = { goals: [{ title: '하프 마라톤 완주', progress: .62, period: '1년 목표', area: '건강', status: '진행 중' }, { title: '책 24권 읽기', progress: .38, period: '1년 목표', area: '성장', status: '진행 중' }, { title: '비상금 300만 원', progress: 1, period: '이번 달', area: '돈', status: '완료' }], projects: [{ title: '상세페이지 리뉴얼', progress: .55, status: '진행 중', due: '2027-04-10' }, { title: '봄 시즌 콘텐츠', progress: 0, status: '시작 전', due: '2027-05-01' }], books: [{ title: '아주 작은 습관의 힘', progress: .4, status: '읽는 중', type: '책', page: 120, pages: 300 }, { title: '원씽', progress: 1, status: '다 읽음', type: '책', page: 250, pages: 250 }] }; goals = S0[kind]; render(); state('견본 · 노션과 연결하면 내 ' + KINDS[kind].name + ' 진행률이 보여요'); return; }
    if (!S.base) return gate('노션 연결 준비 중이에요.');
    if (!S.wid()) return gate('노션의 목표 · 프로젝트 · 책 표와 이어지는 위젯이에요.<br>노션에서 할 일을 끝내거나 읽은 쪽을 적으면 진행률이 저절로 올라가요.', '노션과 연결하기');
    // 종류 · 기간을 빨리 바꿔도 마지막 요청의 답만 그린다(늦게 온 앞 답이 새 화면을 덮지 않게 — 2026-10-02 화면 시험)
    var my = ++seq;
    if (!goals.length) { $('list').innerHTML = ''; $('title').textContent = IDP.opt('goalsync', 'label', '') || KINDS[kind].head; $('sum').textContent = ''; }
    state('불러오는 중…');
    return S.api('GET', '/v1/progress?kind=' + kind + '&filter=' + period).then(function (d) { if (my !== seq) return; goals = d.items || []; state(''); render(); }).catch(function (e) {
      if (my !== seq) return;
      state('');
      if (e.code === 'not_connected' || e.code === 'notion_revoked') return gate('노션 연결이 끊겼어요.', '다시 연결하기');
      if (e.code === 'choose_planner') return gate('연결된 플래너가 여러 개예요. Theme Studio 에서 플래너를 먼저 골라 주세요.');
      if (e.code === 'no_goals' || e.code === 'no_table' || e.code === 'not_shared') return gate('플래너 페이지를 노션 연결 목록에 넣어 주세요.', '다시 연결하기');
      state(e.message);
    });
  }
  // 다른 탭(노션)에서 목표를 고치고 돌아오면 다시 읽는다
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !DEMO && S.wid() && S.base) load(); });
  IDP.options('goalsync', [{ k: 'label', label: '제목', ph: 'GOALS' }], function () { render(); });
  load();
</script>
</body>
</html>
