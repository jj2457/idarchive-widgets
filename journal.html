<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · One-line Journal</title>
<link rel="stylesheet" href="assets/core.css">
<style>
  .line { margin-top: 14px; display: flex; align-items: center; gap: 8px; }
  .line input { font: inherit; font-size: 14px; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 2px; width: 100%; border-radius: 0; }
  .line input:focus { outline: none; border-bottom-color: var(--soft); }
  .past { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
  .p { display: flex; gap: 10px; font-size: 12px; color: var(--sub); }
  .p b { font-weight: 400; letter-spacing: .08em; flex: none; width: 42px; color: var(--deep); }
  .p span { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot { margin-top: 12px; font-size: 11px; color: var(--sub); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="badge">JOURNAL</div><span class="caps" id="date"></span></div>
  <div class="grow">
    <div class="line"><input id="inp" type="text" placeholder="오늘을 한 줄로"></div>
    <div class="past" id="past"></div>
  </div>
  <div class="foot">이 기기에 저장돼요 · 지난 다섯 줄이 함께 보입니다</div>
</div>
<script src="config/themes.js"></script>
<script src="assets/core.js"></script>
<script>
  // One line a day. Deliberately one line: a blank page stops people, a single line does not.
  var FROM = Math.min(23, Math.max(0, +IDP.opt('journal', 'from', 5) || 5));
  var KEY = 'idarchive.journal.' + (IDP.q.get('id') || 'v1');
  function dayKey(d) { d = d || new Date(); var x = new Date(d.getTime()); if (x.getHours() < FROM) x.setDate(x.getDate() - 1); return IDP.iso(x); }
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
  var all = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) {} }
  var inp = document.getElementById('inp');
  inp.value = all[dayKey()] || '';
  inp.oninput = function () { all[dayKey()] = inp.value; save(); };
  inp.onblur = renderPast;
  function renderPast() {
    var box = document.getElementById('past');
    box.innerHTML = '';
    var shown = 0;
    for (var i = 1; i <= 21 && shown < 5; i++) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var k = dayKey(d), t = (all[k] || '').trim();
      if (!t) continue;
      var row = document.createElement('div'); row.className = 'p';
      var b = document.createElement('b'); b.textContent = k.slice(5).replace('-', '.');
      var s = document.createElement('span'); s.textContent = t;
      row.appendChild(b); row.appendChild(s); box.appendChild(row);
      shown++;
    }
  }
  function render() {
    var d = new Date();
    document.getElementById('date').textContent = IDP.pad(d.getMonth() + 1) + '.' + IDP.pad(d.getDate());
    renderPast();
  }
  IDP.options('journal', [], function () { all = load(); inp.value = all[dayKey()] || ''; render(); });
  render();
  setInterval(function () {
    if (document.activeElement !== inp) { inp.value = all[dayKey()] || ''; render(); }
  }, 60000);
</script>
</body>
</html>
