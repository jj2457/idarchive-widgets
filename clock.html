<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID PLANNER · Clock</title>
<link rel="stylesheet" href="assets/core.css?v=r62">
<style>
  .time { font-size: clamp(34px, 15vw, 72px); line-height: 1; color: var(--ink); }
  .time small { font-size: .32em; letter-spacing: .2em; color: var(--sub); margin-left: .3em; font-family: 'Roboto', sans-serif; }
  .date { font-size: clamp(13px, 4.6vw, 20px); margin-top: 12px; }
  .date b { font-weight: 400; color: var(--deep); margin-left: .5em; letter-spacing: .12em; font-size: .8em; }
  .date b.sun { color: var(--red); } .date b.sat { color: var(--blue); }
  .hol { margin-top: 8px; font-size: 11px; color: var(--red); letter-spacing: .08em; min-height: 14px; }
  /* 상단바 한 줄(REQ-038 ③) — 날짜 · 내 문구 · 시각을 페이지 맨 위 얇은 띠로. ?bar=1 */
  [hidden] { display: none !important; }
  .bar { display: flex; align-items: center; gap: 12px; min-height: 100%; }
  .bar .bd { flex: none; font-size: 15px; white-space: nowrap; }
  .bar .bd b { font-weight: 400; color: var(--deep); margin-left: .45em; letter-spacing: .12em; font-size: .78em; }
  .bar .bd b.sun { color: var(--red); } .bar .bd b.sat { color: var(--blue); }
  .bar .bt { flex: 1; min-width: 0; text-align: center; font-size: 12.5px; color: var(--sub); letter-spacing: .06em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .bt i { font-style: normal; color: var(--red); margin-left: .6em; font-size: .9em; }
  .bar .bc { flex: none; font-size: 17px; color: var(--ink); white-space: nowrap; }
  .bar .bc small { font-size: .55em; letter-spacing: .16em; color: var(--sub); margin-left: .25em; font-family: 'Roboto', sans-serif; }
  body.is-bar .card { padding-top: 10px; padding-bottom: 10px; }
  @media (max-width: 420px) { .bar { gap: 8px; } .bar .bd { font-size: 13px; } .bar .bc { font-size: 15px; } .bar .bt { font-size: 11.5px; } }
  /* 레트로 플립 시계(인박스 REQ-186 「시계 위젯도 레트로한 거 하나」) — ?look=flip. 타일 색 = 테마 진한 색 + 웜 차콜, 숫자 = 종이색 */
  /* R6: 칸이 좁으면(창이 작을 때 HOME 오른쪽 열) 숫자 칸도 같이 줄어 잘리지 않게 — vw = 위젯 칸 폭 */
  .flip { display: flex; align-items: center; justify-content: center; gap: clamp(4px, 2.4vw, 12px); max-width: 100%; }
  .flip .grp { display: flex; gap: clamp(3px, 1vw, 6px); }
  .flip .t { position: relative; width: clamp(24px, 16vw, 62px); height: clamp(34px, 22.5vw, 86px); border-radius: 9px; perspective: 300px;
    background: color-mix(in srgb, var(--deep) 30%, #2a2622); color: #f6f1e7; font-family: 'Roboto', 'Helvetica Neue', sans-serif; font-weight: 500;
    font-size: clamp(20px, 11.5vw, 58px); display: grid; place-items: center; box-shadow: 0 2px 0 rgba(0,0,0,.18), inset 0 -1px 0 rgba(255,255,255,.06); }
  .flip .t::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1.5px; background: rgba(0,0,0,.38); }
  .flip .t::before { content: ''; position: absolute; inset: 0 0 50% 0; border-radius: 9px 9px 0 0; background: rgba(255,255,255,.045); }
  .flip .t.go { animation: flipin .42s cubic-bezier(.3,.7,.3,1); }
  @keyframes flipin { 0% { transform: rotateX(-80deg); opacity: .4; } 100% { transform: none; opacity: 1; } }
  .flip .col { display: grid; gap: 9px; } .flip .col i { width: 6px; height: 6px; border-radius: 50%; background: color-mix(in srgb, var(--deep) 40%, #2a2622); }
  .flip .ap { font-family: 'Roboto', sans-serif; font-size: 11px; letter-spacing: .2em; color: var(--sub); align-self: flex-end; margin-left: 2px; }
  @media (max-width: 260px) { .flip .ap { display: none; } .flip .t { width: clamp(22px, 15vw, 62px); height: clamp(32px, 21vw, 86px); font-size: clamp(18px, 10.5vw, 58px); } }
  @media (max-width: 170px) { .flip { gap: 3px; } .flip .grp { gap: 2px; } .flip .t { width: calc((100vw - 50px) / 4.5); height: calc((100vw - 50px) / 3.1); font-size: calc((100vw - 50px) / 5.6); border-radius: 6px; } .flip .col { gap: 5px; } .flip .col i { width: 4px; height: 4px; } }
  .fdate { margin-top: 14px; font-size: clamp(12px, 4vw, 15px); letter-spacing: .06em; }
  .fdate b { font-weight: 400; color: var(--deep); margin-left: .5em; letter-spacing: .14em; font-size: .82em; }
  .fdate b.sun { color: var(--red); } .fdate b.sat { color: var(--blue); }
  @media (prefers-reduced-motion: reduce) { .flip .t.go { animation: none; } }
  /* tone=light (R5 HOME 2026-10-06 「아이보리 큰 면은 밝게」) — 같은 플립 모양, 타일은 테마 옅은 면 · 숫자는 테마 진한 색. 어두운 덩어리가 TODAY 보다 먼저 눈에 걸리지 않게 */
  .flip.light .t { background: color-mix(in srgb, var(--soft) 45%, #ffffff); color: color-mix(in srgb, var(--deep) 72%, #2f2b27);
    box-shadow: 0 1px 0 rgba(0,0,0,.05), inset 0 0 0 1px color-mix(in srgb, var(--deep) 16%, transparent); }
  .flip.light .t::after { background: color-mix(in srgb, var(--deep) 18%, transparent); height: 1px; }
  .flip.light .t::before { background: rgba(255,255,255,.35); }
  .flip.light .col i { background: color-mix(in srgb, var(--deep) 45%, #ffffff); }
</style>
</head>
<body>
<div class="card">
  <div class="bar serif" id="bar" hidden><span class="bd" id="bd"></span><span class="bt" id="bt"></span><span class="bc" id="bc"></span></div>
  <div class="badge" id="badge">Today</div>
  <div class="grow center" id="flipbox" hidden><div class="flip" id="flip"></div><div class="fdate serif" id="fdate"></div></div>
  <div class="grow center" id="full">
    <div class="time serif" id="time"></div>
    <div class="date serif" id="date"></div>
    <div class="hol" id="hol"></div>
  </div>
</div>
<script src="assets/holidays.js"></script>
<script src="config/themes.js"></script>
<script src="assets/core.js?v=r62"></script>
<script>
  var h24 = IDP.q.get('h24') === '1', BAR = IDP.q.get('bar') === '1', FLIP = !BAR && IDP.q.get('look') === 'flip';
  if (FLIP) { document.getElementById('full').hidden = true; document.getElementById('flipbox').hidden = false; }
  if (FLIP && IDP.q.get('tone') === 'light') document.getElementById('flip').classList.add('light');
  var shown = '';
  function tickFlip(d) {   // 바뀐 숫자만 넘긴다(분이 바뀔 때 한 장)
    var h = d.getHours(), hh = h24 ? IDP.pad(h) : IDP.pad(h % 12 || 12), mm = IDP.pad(d.getMinutes()), s = hh + mm;
    var box = document.getElementById('flip');
    if (!box.children.length) box.innerHTML = '<span class="grp"><span class="t"></span><span class="t"></span></span><span class="col"><i></i><i></i></span><span class="grp"><span class="t"></span><span class="t"></span></span>' + (h24 ? '' : '<span class="ap"></span>');
    var tiles = box.querySelectorAll('.t');
    for (var i = 0; i < 4; i++) if (s[i] !== shown[i]) { tiles[i].textContent = s[i]; if (shown) { tiles[i].classList.remove('go'); void tiles[i].offsetWidth; tiles[i].classList.add('go'); } }
    shown = s;
    if (!h24) box.querySelector('.ap').textContent = h < 12 ? 'AM' : 'PM';
    var w = d.getDay();
    document.getElementById('fdate').innerHTML = IDP.plannerDate(d) + '<b class="' + (w === 0 ? 'sun' : w === 6 ? 'sat' : '') + '">' + IDP.DOW[w] + '</b>';
  }
  if (BAR) { document.body.classList.add('is-bar'); document.getElementById('bar').hidden = false; document.getElementById('badge').hidden = true; document.getElementById('full').hidden = true; }
  function esc(t) { var e = document.createElement('span'); e.textContent = t; return e.innerHTML; }
  function tickBar(d) {   // 날짜 · 내 문구(없으면 공휴일 · 기념일) · 시각
    var h = d.getHours(), w = d.getDay(), k = IDP.iso(d), hol = IDP_HOLIDAYS[k] || IDP_MEMORIAL[k] || '';
    document.getElementById('bd').innerHTML = IDP.plannerDate(d) + '<b class="' + (w === 0 ? 'sun' : w === 6 ? 'sat' : '') + '">' + IDP.DOW[w] + '</b>';
    var text = String(IDP.opt('clock', 'text', '') || '').trim();
    document.getElementById('bt').innerHTML = esc(text) + (hol ? '<i>' + esc(hol) + '</i>' : '');
    document.getElementById('bc').innerHTML = (h24 ? IDP.pad(h) : (h % 12 || 12)) + ':' + IDP.pad(d.getMinutes()) + (h24 ? '' : '<small>' + (h < 12 ? 'AM' : 'PM') + '</small>');
  }
  function tick() {
    var d = IDP.now(), h = d.getHours();
    if (BAR) return tickBar(d);
    if (FLIP) return tickFlip(d);
    var hh = h24 ? IDP.pad(h) : (h % 12 || 12);
    document.getElementById('time').innerHTML = hh + ':' + IDP.pad(d.getMinutes()) + (h24 ? '' : '<small>' + (h < 12 ? 'AM' : 'PM') + '</small>');
    var w = d.getDay();
    document.getElementById('date').innerHTML = IDP.plannerDate(d) + '<b class="' + (w === 0 ? 'sun' : w === 6 ? 'sat' : '') + '">' + IDP.DOW[w] + '</b>';
    var k = IDP.iso(d);
    document.getElementById('hol').textContent = IDP_HOLIDAYS[k] || IDP_MEMORIAL[k] || '';
  }
  tick(); setInterval(tick, 1000);
  if (BAR) IDP.options('clock', [{ k: 'text', label: '내 문구', ph: '오늘도 나답게' }], function () { tick(); });
</script>
</body>
</html>
